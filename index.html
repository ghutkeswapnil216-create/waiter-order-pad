<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Grünewald Brunch — Order Pad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Firebase (used only to broadcast sent orders to the kitchen station
     phones — see kitchen-display.html). Everything else in this file
     works exactly as before even if this is left unconfigured. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --cream:#F6F2EA;
    --paper:#FFFFFF;
    --ink:#1E1E1A;
    --ink-soft:#7A7A70;
    --forest:#55695A;
    --forest-dark:#3F4F43;
    --coral:#E2895A;
    --coral-dark:#C96F42;
    --yolk:#EFB93F;
    --line:#E9E4D8;
    --sage:#DEE5DA;
    --step-minus:#D7DDD4;
    --danger:#B5493A;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--yolk); color:var(--ink);}

  /* ---------- Header ---------- */
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 16px;
    background:var(--paper);
    color:var(--ink);
    border-bottom:1px solid var(--line);
    position:static;
  }
  .table-badge{
    display:flex;
    align-items:baseline;
    gap:8px;
    line-height:1.2;
  }
  .table-badge .tb-value{
    font-family:'Montserrat Alternates',sans-serif;
    font-weight:800;
    font-size:24px;
    color:var(--ink);
  }
  .table-badge .tb-label{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .switch-table-btn{
    background:var(--sage);
    border:1px solid var(--line);
    color:var(--forest-dark);
    padding:7px 14px;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .switch-table-btn:hover{ background:#CBDBC7; }

  /* ---------- Layout ---------- */
  .app{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:0;
    min-height:100vh;
  }

  /* ---------- Food / Drinks swipeable pages ---------- */
  .pages-viewport{
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .page-tabs{
    position:sticky;
    top:0;
    z-index:36;
    display:flex;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .page-tab{
    flex:1;
    border:none;
    background:none;
    padding:12px 10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .page-tab.active{
    color:var(--ink);
    border-bottom-color:var(--forest);
  }
  .pages-clip{
    overflow-x:hidden;
    overflow-y:visible;
  }
  .pages-track{
    display:flex;
    width:200%;
    transition:transform .28s ease;
  }
  .page-panel{
    width:50%;
    flex-shrink:0;
    min-width:0;
  }

  /* ---------- Filter pills + search (one combined sticky block,
     so there's no gap/overlap between it and the tabs above it,
     and the search box scrolls WITH the pills instead of sliding
     underneath them) ---------- */
  .sticky-controls{
    position:sticky;
    top:var(--tabs-height, 44px);
    z-index:30;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    overflow:hidden;
    max-height:260px;
    opacity:1;
    transition:max-height .25s ease, opacity .2s ease, border-color .25s ease;
  }
  /* Slides away on scroll-down, reappears on scroll-up (see the
     scroll listener in JS) — collapsing max-height (rather than just
     a transform) so the menu content actually shifts up to fill the
     space, instead of leaving a blank gap where the bar used to be. */
  .sticky-controls.controls-hidden{
    max-height:0;
    opacity:0;
    border-color:transparent;
  }
  .filter-bar{
    padding:14px 26px 10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-pill{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:9px 17px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .filter-pill:hover{ border-color:var(--forest); color:var(--forest-dark); }
  .filter-pill.active{
    background:var(--forest);
    border-color:var(--forest);
    color:var(--cream);
  }

  /* ---------- Menu column ---------- */
  main.menu{
    padding:18px 26px 120px;
    overflow-x:hidden;
  }
  .search-row{
    display:flex;
    gap:10px;
    padding:0 26px 14px;
  }
  .search-row input{
    flex:1;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:15.5px;
    color:var(--ink);
  }
  .search-row input:focus{ outline:2px solid var(--coral); outline-offset:1px; }

  section.category-block{ margin-bottom:34px; scroll-margin-top:130px; }
  .category-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:24px;
    padding-bottom:10px;
    border-bottom:1px solid rgba(61,77,65,0.5);
  }
  .category-head h2{
    font-family:'Montserrat Alternates',sans-serif;
    font-weight:700;
    font-size:20px;
    margin:0;
    color:var(--ink);
  }
  .category-note{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin:6px 0 14px;
  }

  .item-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;
  }
  .item-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    transition:box-shadow .15s, transform .15s;
  }
  .item-card:hover{ box-shadow:0 4px 16px rgba(47,74,61,.1); }
  .item-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
  .item-name{ font-family:'Montserrat Alternates',sans-serif; font-weight:700; font-size:16px; color:var(--ink); line-height:1.3;}
  .tag{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:.4px;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:5px;
    background:var(--sage);
    color:var(--forest-dark);
    width:fit-content;
  }
  .card-bottom{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .customize-icon-btn{
    width:32px; height:32px;
    flex-shrink:0;
    border-radius:8px;
    border:none;
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, color .15s;
  }
  .customize-icon-btn:hover{ background:var(--cream); color:var(--ink); }

  /* qty stepper on card — kept narrow and pushed to the right via
     card-bottom's space-between, so it doesn't compete visually with
     the customize icon on the left. */
  .qty-stepper{
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    padding:0;
    margin-left:auto;
  }
  .step-btn{
    width:32px; height:32px;
    border-radius:50%;
    border:none;
    font-family:'Space Mono',monospace;
    font-size:17px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s;
    flex-shrink:0;
  }
  .step-btn.minus{ background:var(--step-minus); color:var(--ink); }
  .step-btn.minus:hover{ background:#C7CFC2; }
  .step-btn.minus:disabled{ background:var(--step-minus); opacity:.55; cursor:not-allowed; }
  .step-btn.plus{ background:var(--forest); color:#fff; }
  .step-btn.plus:hover{ background:var(--forest-dark); }
  .step-btn.plus.zero{ background:#8A9F90; opacity:.3; }
  .step-btn.plus.zero:hover{ background:#7C9182; opacity:.3; }
  .step-val{
    font-family:'Space Mono',monospace;
    font-size:15px;
    font-weight:700;
    min-width:16px;
    text-align:center;
    color:var(--ink);
  }

  /* A card lights up yellow the moment any quantity of that dish is
     on the ticket — a quick visual flag for "this is being ordered",
     independent of exactly how many/which configuration. */
  .item-card.in-order{
    background:var(--yolk);
    border-color:#D9A61E;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.6;
  }
  .empty-state .big{ font-size:32px; display:block; margin-bottom:10px; }

  /* ---------- Order ticket ---------- */
  aside.ticket{
    border-left:1px solid var(--line);
    background:var(--paper);
    position:sticky;
    top:0;
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  .ticket-head{
    padding:14px 18px 10px;
    border-bottom:1px dashed var(--line);
  }
  .ticket-head h3{
    font-family:'Montserrat Alternates',sans-serif;
    margin:0 0 2px;
    font-size:18px;
    color:var(--forest-dark);
  }
  .ticket-head .meta{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .ticket-guest-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
  }
  .ticket-guest-row label{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .ticket-guest-row input{
    width:52px;
    padding:5px 8px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:'Space Mono',monospace;
    font-size:13px;
  }
  .move-table-link{
    background:none;
    border:none;
    color:var(--coral-dark);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    margin-top:8px;
    display:block;
  }
  .ticket-items{
    flex:1;
    overflow-y:auto;
    padding:10px 18px;
  }
  .ticket-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    margin-top:40px;
    padding:0 20px;
    line-height:1.5;
  }
  .ticket-line{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .ticket-line:last-child{ border-bottom:none; }
  .tl-top{ display:flex; justify-content:space-between; gap:8px; }
  .tl-name{ font-weight:600; font-size:15.5px; color:var(--ink); }
  .tl-price{ font-family:'Space Mono',monospace; font-size:15px; color:var(--forest-dark); font-weight:700; white-space:nowrap;}
  .tl-mods{ font-size:13px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}
  .sent-badge{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    font-weight:700;
    color:#3F8452;
    background:#E4F3E7;
    padding:2px 8px;
    border-radius:999px;
    margin-top:4px;
  }
  .sent-badge.partial{
    color:var(--coral-dark);
    background:#FFF1E7;
  }
  .tl-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
  }
  .qty-group{ display:flex; align-items:center; gap:8px; }
  .qty-btn{
    width:28px; height:28px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--cream);
    cursor:pointer;
    font-family:'Space Mono',monospace;
    font-size:16px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
  }
  .qty-btn:hover{ background:var(--sage); }
  .qty-val{ font-family:'Space Mono',monospace; font-size:15px; min-width:18px; text-align:center;}
  .remove-btn{
    background:none;
    border:none;
    color:var(--danger);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
    font-family:'Inter',sans-serif;
  }

  .ticket-footer{
    border-top:1px dashed var(--line);
    padding:14px 18px 18px;
  }
  .totals-row{
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono',monospace;
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .totals-row.grand{
    font-size:19px;
    color:var(--ink);
    font-weight:700;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--line);
  }
  .send-btn{
    width:100%;
    margin-top:14px;
    background:var(--coral);
    color:#fff;
    border:none;
    padding:14px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:.2px;
    cursor:pointer;
    transition:background .15s;
  }
  .send-btn:hover{ background:var(--coral-dark); }
  .send-btn:disabled{ background:#D8CFBE; cursor:not-allowed; }
  .clear-btn{
    width:100%;
    margin-top:8px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:10px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    cursor:pointer;
  }
  .clear-btn:hover{ background:var(--cream); }

  /* ---------- Modifier bottom sheet ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(32,52,42,.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    padding:0;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--cream);
    border-radius:26px 26px 0 0;
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow-y:auto;
    padding:12px 20px 28px;
    box-shadow:0 -12px 40px rgba(30,40,32,.18);
    animation: sheet-slide-up .3s cubic-bezier(.22,.9,.36,1);
  }
  @keyframes sheet-slide-up{
    from{ transform:translateY(100%); }
    to{ transform:translateY(0); }
  }
  .sheet-handle{
    width:40px;
    height:4px;
    border-radius:999px;
    background:var(--line);
    margin:2px auto 18px;
  }
  .modal h3{
    font-family:'Montserrat Alternates',sans-serif;
    font-weight:700;
    font-size:30px;
    line-height:1.15;
    margin:0 0 6px;
    color:var(--ink);
  }
  .modal .modal-desc{ font-size:15px; color:var(--ink-soft); margin-bottom:18px; line-height:1.45;}
  .modal .group-title{
    font-family:'Montserrat Alternates',sans-serif;
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.1px;
    color:var(--forest);
    margin:16px 0 9px;
  }
  .modal-qty-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    box-shadow:0 2px 8px rgba(30,40,32,.05);
  }
  .modal-qty-row .qty-label{ font-size:15px; font-weight:700; color:var(--ink); line-height:1.35; padding-right:14px; }
  .modal-qty-row .qty-group{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .modal-qty-row .qty-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background:var(--forest-dark);
    color:var(--cream);
    font-family:'Montserrat Alternates',sans-serif;
    font-weight:700;
    font-size:17px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .modal-qty-row .qty-btn:hover{ background:#2C3930; }
  .modal-qty-row .qty-val{ font-family:'Montserrat Alternates',sans-serif; font-size:18px; font-weight:700; min-width:18px; text-align:center; color:var(--ink); }

  .unit-block{
    border:1px solid var(--line);
    border-radius:22px;
    padding:6px 16px 18px;
    margin-top:16px;
    background:#F1ECE0;
  }
  .unit-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top:12px;
    margin-bottom:2px;
  }
  .unit-head.unit-head-single{
    display:none;
  }
  .unit-head .unit-title{
    font-family:'Montserrat Alternates',sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .unit-copy-link{
    background:none;
    border:none;
    color:var(--coral-dark);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .unit-block .opt-row{ padding:13px 14px; margin-bottom:9px; font-size:14px; border-radius:14px; }
  .unit-block textarea{ margin-top:4px; min-height:44px; font-size:14.5px; }
  .unit-price-tag{
    font-family:'Montserrat Alternates',sans-serif;
    font-size:13px;
    color:var(--coral-dark);
    font-weight:700;
  }
  .opt-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:14px 15px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:9px;
    cursor:pointer;
    font-size:14px;
    transition:border-color .15s, background .15s;
  }
  .opt-row > span:first-child{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    line-height:1.4;
  }
  .opt-row input{
    margin:1px 0 0;
    width:18px;
    height:18px;
    border-radius:5px;
    accent-color:var(--forest);
    flex-shrink:0;
  }
  .opt-row .opt-price{
    font-family:'Space Mono',monospace;
    font-size:13.5px;
    color:var(--ink-soft);
    flex-shrink:0;
    padding-top:1px;
  }
  .opt-row:hover{ border-color:var(--forest); }
  .opt-row.checked{ border-color:var(--forest); background:var(--sage); }
  .opt-row.allergy.checked{ border-color:var(--danger); background:#FBEAE6; }
  .opt-row.choice.checked{ border-color:var(--coral); background:#FBEBE0; }
  .group-required{
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:600;
    color:var(--coral-dark);
    margin-left:6px;
    text-transform:none;
    letter-spacing:0;
  }
  .modal textarea{
    width:100%;
    margin-top:6px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    resize:vertical;
    min-height:52px;
  }
  .modal textarea:focus{ outline:2px solid var(--forest); outline-offset:1px; }
  .modal-footer{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .modal-footer button{
    flex:1;
    padding:14px;
    border-radius:14px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    border:none;
    transition:background .15s;
  }
  .modal-cancel{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--line) !important;}
  .modal-cancel:hover{ background:var(--sage); }
  .modal-confirm{ background:var(--forest-dark); color:var(--cream); }
  .modal-confirm:hover{ background:#2C3930; }
  .modal-price-live{ font-family:'Montserrat Alternates',sans-serif; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--forest-dark);
    color:var(--cream);
    padding:12px 20px;
    border-radius:10px;
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }

/* ---------------------------------------------------------------
   STATE
   Every table keeps its own order array, keyed by table id, so
   switching tables never loses what's already been added elsewhere.
   `order` is always kept as a live alias to orders[currentTable] —
   lines are mutated in place (push/splice/length=0) rather than
   reassigned, so the alias never goes stale.
--------------------------------------------------------------- */
let orders = {};        // tableId -> array of order lines
let tableMeta = {};      // tableId -> {guests: ""}
let currentTable = null;
let order = [];          // alias of orders[currentTable]
let activeFilter = "all";
let activeSearch = "";
let pendingItem = null;
let pendingQty = 1;
let pendingUnits = []; // one entry per unit: {selections:[{key,label,price}], note:""}

/* A line's "key" identifies its exact configuration (name + mods + note).
   Two additions with the same key merge into one line with a combined qty,
   instead of piling up duplicate rows — e.g. two separate "gluten free"
   Pancake Bouquets become one line reading ×2, while a "granola free" one
   stays its own line. */
function lineKey(name, mods, note){
  const modsPart = mods.map(m=>m.label).sort().join(",");
  return `${name}::${modsPart}::${note.trim()}`;
}

--------------------------------------------------------------- */
const TABLE_COUNT = 16; // adjust to match how many numbered tables the venue has
const tableSelectScreen = document.getElementById("tableSelectScreen");
const orderScreen = document.getElementById("orderScreen");
const tableGrid = document.getElementById("tableGrid");
const tssPrompt = document.getElementById("tssPrompt");

// When true, the next table tapped on the grid RECEIVES the current
// table's order (a full move) instead of opening its own order — used
// when a guest physically moves tables mid-order.
let moveMode = false;
let moveModeSourceTable = null;

function orderTotalFor(tableId){
  const lines = orders[tableId] || [];
  return lines.reduce((s,l)=>s+l.qty,0);
}

function renderTableGrid(){
  let html = "";
  for(let i=1; i<=TABLE_COUNT; i++){
    const count = orderTotalFor(i);
    const isSource = moveMode && String(i)===String(moveModeSourceTable);
    html += `
      <button class="table-btn ${count>0?"has-order":""}" data-table="${i}" ${isSource?"disabled":""}>
        ${count>0 ? `<span class="tb-count">${count}</span>` : ""}
        ${i}
        <span class="tb-sub">${isSource ? "current" : (count>0 ? count+" items" : "table")}</span>
      </button>
    `;
  }
  tableGrid.innerHTML = html;
  tableGrid.querySelectorAll(".table-btn:not(:disabled)").forEach(btn=>{
    btn.addEventListener("click", ()=> selectTable(btn.dataset.table));
  });

  if(tssPrompt){
    tssPrompt.innerHTML = moveMode
      ? `Moving Table ${moveModeSourceTable}'s order — pick the new table <button class="unit-copy-link" id="cancelMoveBtn" style="margin-left:8px;">Cancel</button>`
      : "Select a table to start the order";
    const cancelBtn = document.getElementById("cancelMoveBtn");
    if(cancelBtn) cancelBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      moveMode = false;
      selectTable(moveModeSourceTable);
    });
  }
}

function selectTable(id){
  id = String(id).trim();
  if(!id) return;

  if(moveMode){
    const source = moveModeSourceTable;
    if(id === source){ moveMode = false; }
    else {
      if(orders[id] && orders[id].length > 0){
        const ok = confirm(`Table ${id} already has an order in progress. Merge Table ${source}'s order into it?`);
        if(!ok) return;
        orders[id] = orders[id].concat(orders[source]);
      } else {
        orders[id] = orders[source];
      }
      tableMeta[id] = tableMeta[source] || {guests:""};
      delete orders[source];
      delete tableMeta[source];
      moveMode = false;
      showToast(`Order moved from Table ${source} to Table ${id}`);
    }
  }

  currentTable = id;
  if(!orders[id]) orders[id] = [];
  order = orders[id];
  if(!tableMeta[id]) tableMeta[id] = {guests:""};

  document.getElementById("activeTableLabel").textContent = id;
  document.getElementById("guestCount").value = tableMeta[id].guests;

  tableSelectScreen.style.display = "none";
  orderScreen.style.display = "block";

  renderMenu();
  renderDrinksMenu();
  renderTicket();
  window.scrollTo(0,0);
}

function goToTableSelect(){
  currentTable = null;
  orderScreen.style.display = "none";
  tableSelectScreen.style.display = "flex";
  renderTableGrid();
}

// Escapes a string for safe use inside an HTML attribute (e.g. data-name="...").
// Needed because a couple of dish names contain literal quote characters
// (the Special Menu items), which would otherwise break the attribute.
function escapeAttr(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

}

// Station routing — matches how the 3 kitchen phones are staffed:
//  · pancakeBowlSmoothie: pancakes, smoothie bowls, natural smoothies
//  · hotFoodEggsSalad: every egg dish + the salads (the "food" group)
//  · drinks: water, everyday coffees, and the Super Special warm drinks
function stationForItemName(name){
  const it = findItemByName(name);
  if(!it) return null;
  if(it.group === "pancake" || it.group === "bowl" || it.group === "smoothie") return "pancakeBowlSmoothie";
  if(it.group === "food") return "hotFoodEggsSalad";
  if(["cooldrink","water","warmdrink","specialwarm"].includes(it.group)) return "drinks";
  return null;
}

function broadcastOrderToKitchen(tableId, guests, lines){
  if(!kitchenDb) return;
  const buckets = {pancakeBowlSmoothie:[], hotFoodEggsSalad:[], drinks:[]};
  lines.forEach(line=>{
    const station = stationForItemName(line.name);
    if(!station) return;
    buckets[station].push({
      name: line.name,
      qty: line.qty,
      mods: line.mods.map(m=>m.label),
      note: line.note || ""
    });
  });
  Object.keys(buckets).forEach(station=>{
    if(buckets[station].length === 0) return;
    kitchenDb.ref("stationOrders/"+station).push({
      table: tableId,
      guests: guests || "",
      createdAt: Date.now(),
      status: "pending",
      items: buckets[station]
    });
  });
}

function attachCardHandlers(container){
  container.querySelectorAll(".customize-icon-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const item = findItemByName(btn.dataset.name);
      openItemModal(item);
    });
  });
  container.querySelectorAll(".qty-stepper").forEach(stepper=>{
    const name = stepper.dataset.name;
    stepper.querySelector(".plus").addEventListener("click", ()=> bumpPlainLine(name, 1));
    stepper.querySelector(".minus").addEventListener("click", ()=> bumpPlainLine(name, -1));
  });
}

/* ---------------------------------------------------------------
   LINE MERGING — any add (plain card stepper or a customized modal
   add) goes through here, so two identical configurations combine
   into one line with qty > 1, while different configurations of the
   same dish stay as separate lines.
--------------------------------------------------------------- */
function addOrUpdateLine(item, mods, note, qtyDelta){
  const key = lineKey(item.name, mods, note);
  let line = order.find(l=>l.key===key);
  if(!line){
    if(qtyDelta <= 0) return;
    const unitPrice = item.price + mods.reduce((s,m)=>s+m.price,0);
    line = { uid: Date.now()+"-"+Math.random().toString(36).slice(2,7), name:item.name, basePrice:item.price, mods, unitPrice, qty:0, note, key, sentQty:0 };
    order.push(line);
  }
  line.qty += qtyDelta;
  if(line.qty <= 0){
    const idx = order.indexOf(line);
    if(idx > -1) order.splice(idx, 1);
  } else {
    line.sentQty = Math.min(line.sentQty, line.qty); // can't have "sent" more than what's left
  }
}

/* The card's own +/- stepper always targets the plain (no modifier,
   no note) configuration of that dish. */
function defaultQtyFor(name){
  const line = order.find(l=>l.name===name && l.mods.length===0 && !l.note);
  return line ? line.qty : 0;
}

function bumpPlainLine(name, delta){
  const item = findItemByName(name);
  addOrUpdateLine(item, [], "", delta);
  renderTicket();
  refreshCardSteppers();
}

/* Total quantity of a dish across ALL its configurations combined —
   e.g. 1 gluten-free + 1 granola-free + 2 plain Pancake Bouquets = 4. */
function totalQtyForItem(name){
  return order.filter(l=>l.name===name).reduce((s,l)=>s+l.qty,0);
}

/* Re-render both pages' grids from current state, so every card's
   stepper value and "in-order" tint always reflects the order exactly
   — simpler and less error-prone than patching individual DOM nodes.
   Both pages stay mounted in the DOM (for the swipe animation), so
   both need refreshing regardless of which one is currently visible. */
function refreshCardSteppers(){
  renderMenu();
  renderDrinksMenu();
}

function unitPrice(unit){
  return pendingItem.price + unit.selections.reduce((s,m)=>s+m.price,0);
}
function totalAllUnits(){
  return pendingUnits.reduce((s,u)=>s+unitPrice(u),0);
}

function setQty(newQty){
  newQty = Math.max(1, newQty);
  if(newQty > pendingQty){
    for(let i=pendingQty; i<newQty; i++) pendingUnits.push({selections:[], note:""});
  } else if(newQty < pendingQty){
    pendingUnits = pendingUnits.slice(0, newQty);
  }
  pendingQty = newQty;
  renderModal();
}

function renderModal(){
  const it = pendingItem;

  const optionGroupHTML = (unitIdx, title, list, keyPrefix, extraClass="", single=false) => {
    if(!list || list.length===0) return "";

      <div class="group-title">${title}${requiredTag}</div>

    // Only label units when there's more than one (e.g. 3 pancakes with

    // heading and keep the sheet shorter.
    const unitHead = pendingUnits.length > 1
      ? `<div class="unit-head"><span class="unit-title">Item ${idx+1}</span><span class="unit-price-tag">${fmt(unitPrice(unit))}</span></div>`
      : `<div class="unit-head unit-head-single"><span class="unit-price-tag">${fmt(unitPrice(unit))}</span></div>`;

    return `
      <div class="unit-block">
        ${unitHead}
        ${copyLink}
        ${choiceGroupsHTML}
        ${optionGroupHTML(idx, "Options", it.options, "opt-")}
        ${optionGroupHTML(idx, "Extras", it.extras, "ext-")}
        ${optionGroupHTML(idx, "Add ons", it.addons, "add-")}

      </div>

  }).join("");

  modalBody.innerHTML = `
    <div class="sheet-handle"></div>
    <h3>${it.name}</h3>
    ${it.desc ? `<div class="modal-desc">${it.desc}</div>` : ""}

        <span class="qty-val" id="modalQtyVal">${pendingQty}</span>

      </div>
    </div>
    ${unitsHTML}
    <div class="modal-footer">
      <button class="modal-cancel" id="modalCancel">Cancel</button>
      <button class="modal-confirm" id="modalConfirm">Add ${pendingQty>1?"all "+pendingQty+" — ":"— "}<span class="modal-price-live">${fmt(totalAllUnits())}</span></button>
    </div>
  `;

  document.getElementById("modalQtyMinus").addEventListener("click", ()=> setQty(pendingQty-1));
  document.getElementById("modalQtyPlus").addEventListener("click", ()=> setQty(pendingQty+1));

  modalBody.querySelectorAll(".opt-row").forEach(row=>{
    row.addEventListener("click", (e)=>{
      e.preventDefault();
      const unitIdx = parseInt(row.dataset.unit, 10);
      const key = row.dataset.key;
      const group = row.dataset.group;
      const single = row.dataset.single === "true";
      const unit = pendingUnits[unitIdx];
      const existingIdx = unit.selections.findIndex(s=>s.key===key);
      if(single){
        if(existingIdx>-1){
          unit.selections.splice(existingIdx,1); // tap again to clear the pick
        } else {
          unit.selections = unit.selections.filter(s=>!s.key.startsWith(group));
          unit.selections.push({key, label: row.dataset.label, price: parseFloat(row.dataset.price)});
        }
      } else {
        if(existingIdx>-1){
          unit.selections.splice(existingIdx,1);
        } else {
          unit.selections.push({key, label: row.dataset.label, price: parseFloat(row.dataset.price)});
        }
      }
      renderModal();
    });
  });

  modalBody.querySelectorAll("[data-note-unit]").forEach(ta=>{
    ta.addEventListener("input", (e)=>{
      pendingUnits[parseInt(ta.dataset.noteUnit,10)].note = e.target.value;
    });
  });

  modalBody.querySelectorAll("[data-copy-to]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.copyTo, 10);
      pendingUnits[idx] = {
        selections: pendingUnits[0].selections.map(s=>({...s})),
        note: pendingUnits[0].note
      };
      renderModal();
    });
  });

  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalConfirm").addEventListener("click", confirmAddToOrder);
}

function confirmAddToOrder(){
  const item = pendingItem;
  const qty = pendingQty;
  pendingUnits.forEach(unit=>{
    addOrUpdateLine(item, unit.selections, unit.note.trim(), 1);
  });
  closeModal();
  renderTicket();
  refreshCardSteppers();
  showToast(`${qty>1 ? qty+"× " : ""}${item.name} added to ticket`);
}

overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });

/* ---------------------------------------------------------------
   TICKET / ORDER PANEL
--------------------------------------------------------------- */
const ticketItems = document.getElementById("ticketItems");
const totalItemsEl = document.getElementById("totalItems");
const totalPriceEl = document.getElementById("totalPrice");
const sendBtn = document.getElementById("sendBtn");
const ticketMeta = document.getElementById("ticketMeta");
const cartToggleCount = document.getElementById("cartToggleCount");

function renderTicket(){
  if(order.length === 0){
    ticketItems.innerHTML = `<div class="ticket-empty">Tap a dish to add it here.<br>Build the order, then send it to the kitchen.</div>`;
  } else {
    ticketItems.innerHTML = order.map(line=>{
      const modsText = line.mods.length
        ? line.mods.map(m=> m.price>0 ? `${m.label} (+${fmt(m.price)})` : m.label).join(" · ")
        : "";
      let sentBadge = "";
      if(line.sentQty > 0 && line.sentQty === line.qty){
        sentBadge = `<span class="sent-badge">✓ Sent to kitchen</span>`;
      } else if(line.sentQty > 0 && line.sentQty < line.qty){
        sentBadge = `<span class="sent-badge partial">✓ ${line.sentQty} sent · ${line.qty - line.sentQty} new</span>`;
      }
      return `
        <div class="ticket-line" data-uid="${line.uid}">
          <div class="tl-top">
            <div class="tl-name">${line.name}</div>
            <div class="tl-price">${fmt(line.unitPrice*line.qty)}</div>
          </div>
          ${sentBadge}
          ${modsText ? `<div class="tl-mods">${modsText}</div>` : ""}
          ${line.note ? `<div class="tl-mods">📝 ${line.note}</div>` : ""}
          <div class="tl-controls">
            <div class="qty-group">
              <button class="qty-btn" data-action="dec">–</button>
              <span class="qty-val">${line.qty}</span>
              <button class="qty-btn" data-action="inc">+</button>
            </div>
            <button class="remove-btn" data-action="remove">Remove</button>
          </div>
        </div>
      `;
    }).join("");
  }

  ticketItems.querySelectorAll(".ticket-line").forEach(el=>{
    const uid = el.dataset.uid;
    el.querySelector('[data-action="inc"]').addEventListener("click", ()=> changeQty(uid, 1));
    el.querySelector('[data-action="dec"]').addEventListener("click", ()=> changeQty(uid, -1));
    el.querySelector('[data-action="remove"]').addEventListener("click", ()=> removeLine(uid));
  });

  const totalItemsCount = order.reduce((s,l)=>s+l.qty,0);
  const totalPrice = order.reduce((s,l)=>s+l.unitPrice*l.qty,0);
  totalItemsEl.textContent = totalItemsCount;
  totalPriceEl.textContent = fmt(totalPrice);
  cartToggleCount.textContent = totalItemsCount;
  sendBtn.disabled = order.length === 0;

  const guests = document.getElementById("guestCount").value.trim();
  ticketMeta.textContent = currentTable
    ? `Table ${currentTable}${guests ? " · " + guests + " guests" : ""}`
    : "No table selected";
}

function changeQty(uid, delta){
  const line = order.find(l=>l.uid===uid);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0){
    const idx = order.indexOf(line);
    if(idx > -1) order.splice(idx, 1);
  } else {
    line.sentQty = Math.min(line.sentQty, line.qty);
  }
  renderTicket();
  refreshCardSteppers();
}

function removeLine(uid){
  const idx = order.findIndex(l=>l.uid===uid);
  if(idx > -1) order.splice(idx, 1);
  renderTicket();
  refreshCardSteppers();
}

document.getElementById("clearBtn").addEventListener("click", ()=>{
  if(order.length===0) return;
  if(confirm("Clear the entire order for this table?")){
    order.length = 0;
    renderTicket();
    refreshCardSteppers();
  }
});

sendBtn.addEventListener("click", ()=>{
  if(!currentTable || order.length===0) return;

  // Only broadcast what hasn't already been sent — a line added after
  // an earlier send only forwards its NEW quantity, so the kitchen
  // never gets duplicate prep tickets for the same dish.
  const linesToSend = [];
  let newItemsPrice = 0;
  order.forEach(line=>{
    const unsent = line.qty - line.sentQty;
    if(unsent > 0){
      linesToSend.push({ name: line.name, qty: unsent, mods: line.mods, note: line.note });
      newItemsPrice += line.unitPrice * unsent;
    }
  });

  if(linesToSend.length === 0){
    showToast("Nothing new to send — this table's order is already with the kitchen.");
    return;
  }

  const sentTable = currentTable;
  const guests = (tableMeta[currentTable] && tableMeta[currentTable].guests) || "";
  broadcastOrderToKitchen(sentTable, guests, linesToSend);

  // The order STAYS in the ticket (not cleared) so the waiter can
  // still see everything that's been ordered for this table, sent or
  // not — only the "sent" marker moves forward.
  order.forEach(line=>{ line.sentQty = line.qty; });

  showToast(`Sent to kitchen for Table ${sentTable} — ${fmt(newItemsPrice)}`);
  renderTicket();
  goToTableSelect();
});

document.getElementById("guestCount").addEventListener("input", (e)=>{
  if(currentTable) tableMeta[currentTable].guests = e.target.value;
  renderTicket();
});

/* ---------------------------------------------------------------
   MOBILE CART TOGGLE — tapping the floating Ticket button opens the
   bottom sheet with a dimmed backdrop behind it; tapping anywhere on
   that backdrop (not just the Ticket button again) closes it.
--------------------------------------------------------------- */
const ticketPanel = document.getElementById("ticketPanel");
const ticketBackdrop = document.getElementById("ticketBackdrop");

function toggleTicketPanel(){
  const isOpen = ticketPanel.classList.toggle("open");
  ticketBackdrop.classList.toggle("open", isOpen);
}
function closeTicketPanel(){
  ticketPanel.classList.remove("open");
  ticketBackdrop.classList.remove("open");
}

document.getElementById("cartToggle").addEventListener("click", toggleTicketPanel);
ticketBackdrop.addEventListener("click", closeTicketPanel);

/* ---------------------------------------------------------------
   SEARCH
--------------------------------------------------------------- */
document.getElementById("searchBox").addEventListener("input", (e)=>{
  activeSearch = e.target.value;
  renderMenu();
});
document.getElementById("drinksSearchBox").addEventListener("input", (e)=>{
  activeDrinksSearch = e.target.value;
  renderDrinksMenu();
});

/* ---------------------------------------------------------------
   PAGE SWIPE — Food and Drinks live side by side on a sliding track.
   Tapping a tab or swiping switches between them, so the drinks menu
   doesn't force a long scroll past the whole food menu to reach.
--------------------------------------------------------------- */
let currentPage = "food"; // "food" | "drinks"
const pagesTrack = document.getElementById("pagesTrack");
const pagesViewport = document.getElementById("pagesViewport");

// Measures the tabs' real rendered height and exposes it as a CSS
// variable, so the sticky filter/search block below always sits
// exactly flush against it — no hardcoded pixel guess to drift out
// of sync across font sizes or breakpoints (which was causing a gap
// or overlap depending on screen size).
function syncTabsHeight(){
  const tabsEl = document.querySelector(".page-tabs");
  if(tabsEl){
    document.documentElement.style.setProperty("--tabs-height", tabsEl.offsetHeight + "px");
  }
}
syncTabsHeight();
window.addEventListener("resize", syncTabsHeight);

// Hide the filter pills + search bar while scrolling down (to give the
// menu more room), and bring them back the moment the person scrolls
// up even slightly — a small threshold avoids it flickering on tiny
// scroll jitters, and it always reappears near the very top.
let lastScrollY = window.scrollY;
window.addEventListener("scroll", ()=>{
  const y = window.scrollY;
  const goingDown = y > lastScrollY;
  const delta = Math.abs(y - lastScrollY);
  const controls = document.querySelectorAll(".sticky-controls");
  if(y < 30){
    controls.forEach(el=> el.classList.remove("controls-hidden"));
  } else if(delta > 4){
    controls.forEach(el=> el.classList.toggle("controls-hidden", goingDown));
  }
  lastScrollY = y;
}, {passive:true});

function goToPage(page){
  currentPage = page;
  pagesTrack.style.transform = page === "drinks" ? "translateX(-50%)" : "translateX(0)";
  document.querySelectorAll(".page-tab").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.page === page);
  });
}

document.querySelectorAll(".page-tab").forEach(btn=>{
  btn.addEventListener("click", ()=> goToPage(btn.dataset.page));
});

let swipeStartX = 0, swipeStartY = 0, swiping = false;
pagesViewport.addEventListener("touchstart", (e)=>{
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swiping = true;
}, {passive:true});
pagesViewport.addEventListener("touchend", (e)=>{
  if(!swiping) return;
  swiping = false;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
    if(dx > 0 && currentPage === "food") goToPage("drinks");   // swipe right -> Drinks
    else if(dx < 0 && currentPage === "drinks") goToPage("food"); // swipe left -> back to Food
  }
}, {passive:true});

/* ---------------------------------------------------------------
   TOAST
--------------------------------------------------------------- */
let toastTimer;
function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove("show"), 2400);
}

   INIT — start on the table-select screen; the order pad itself
   only becomes visible once a table has been chosen.
--------------------------------------------------------------- */
renderFilterBar();
renderDrinksFilterBar();
renderDrinksMenu();
renderTableGrid();
</script>
