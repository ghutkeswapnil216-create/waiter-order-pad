<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Grünewald Brunch — Order Pad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EC;
    --paper:#FFFFFF;
    --ink:#2B2B24;
    --ink-soft:#6B6A5E;
    --forest:#2F4A3D;
    --forest-dark:#20342A;
    --coral:#E2895A;
    --coral-dark:#C96F42;
    --yolk:#EFB93F;
    --line:#E7E0D0;
    --sage:#DCE6DA;
    --danger:#B5493A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--yolk); color:var(--ink);}

  /* ---------- Header ---------- */
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 22px;
    background:var(--forest);
    color:var(--cream);
    position:sticky;
    top:0;
    z-index:40;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.2px;
  }
  .brand .sub{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:#C9D8CD;
    text-transform:uppercase;
    letter-spacing:1.5px;
  }
  .table-controls{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Mono',monospace;
    font-size:13px;
  }
  .table-controls label{color:#C9D8CD; text-transform:uppercase; letter-spacing:1px; font-size:11px;}
  .table-controls input, .table-controls select{
    background:#233E33;
    border:1px solid #3C5C4C;
    color:var(--cream);
    padding:7px 10px;
    border-radius:8px;
    font-family:'Space Mono',monospace;
    font-size:13px;
    width:76px;
  }
  .table-badge{
    display:flex;
    flex-direction:column;
    line-height:1.2;
  }
  .table-badge .tb-label{
    font-size:10px;
    color:#C9D8CD;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .table-badge .tb-value{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
  }
  .switch-table-btn{
    background:#233E33;
    border:1px solid #3C5C4C;
    color:var(--cream);
    padding:8px 12px;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    cursor:pointer;
  }
  .switch-table-btn:hover{ background:#2E4E40; }
  .clock-badge{
    font-family:'Space Mono',monospace;
    font-size:12px;
    background:#233E33;
    padding:6px 10px;
    border-radius:8px;
    border:1px solid #3C5C4C;
    color:#F2C879;
  }

  /* ---------- Layout ---------- */
  .app{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:0;
    min-height:calc(100vh - 62px);
  }

  /* ---------- Filter pills ---------- */
  .filter-bar{
    position:sticky;
    top:62px;
    z-index:30;
    background:var(--cream);
    padding:16px 26px 10px;
    border-bottom:1px solid var(--line);
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-pill{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .filter-pill:hover{ border-color:var(--forest); color:var(--forest-dark); }
  .filter-pill.active{
    background:var(--forest);
    border-color:var(--forest);
    color:var(--cream);
  }

  /* ---------- Menu column ---------- */
  main.menu{
    padding:18px 26px 120px;
    overflow-x:hidden;
  }
  .search-row{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .search-row input{
    flex:1;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .search-row input:focus{ outline:2px solid var(--coral); outline-offset:1px; }

  section.category-block{ margin-bottom:34px; scroll-margin-top:130px; }
  .category-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:4px;
    padding-bottom:8px;
    border-bottom:2px solid var(--forest);
  }
  .category-head h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0;
    color:var(--forest-dark);
  }
  .category-note{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin:6px 0 14px;
  }

  .item-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:12px;
  }
  .item-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:box-shadow .15s, transform .15s;
  }
  .item-card:hover{ box-shadow:0 4px 16px rgba(47,74,61,.1); }
  .item-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
  .item-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; color:var(--ink); line-height:1.25;}
  .item-price{
    font-family:'Space Mono',monospace;
    font-size:13px;
    font-weight:700;
    color:var(--coral-dark);
    white-space:nowrap;
  }
  .ticket-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-family:'Space Mono',monospace;
    font-size:10px;
    font-weight:700;
    background:var(--yolk);
    color:var(--forest-dark);
    padding:2px 7px;
    border-radius:999px;
    width:fit-content;
  }
  .tag{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    letter-spacing:.4px;
    text-transform:uppercase;
    padding:2px 6px;
    border-radius:5px;
    background:var(--sage);
    color:var(--forest-dark);
    width:fit-content;
  }
  .card-bottom{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .customize-link{
    background:none;
    border:none;
    color:var(--forest);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  /* qty stepper on card */
  .qty-stepper{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 6px;
  }
  .step-btn{
    width:24px; height:24px;
    border-radius:50%;
    border:none;
    background:var(--forest);
    color:var(--cream);
    font-family:'Space Mono',monospace;
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .step-btn:hover{ background:var(--forest-dark); }
  .step-btn.minus:disabled{ background:#CFC8B6; cursor:not-allowed; }
  .step-val{
    font-family:'Space Mono',monospace;
    font-size:13.5px;
    font-weight:700;
    min-width:14px;
    text-align:center;
    color:var(--ink);
  }

  /* per-person special card style */
  .item-card.special{
    background:linear-gradient(180deg,#FFF9EC,#FFF3DC);
    border-color:#F0D89A;
  }
  .item-card.special .item-price{ color:var(--danger); }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.6;
  }
  .empty-state .big{ font-size:32px; display:block; margin-bottom:10px; }

  /* ---------- Order ticket ---------- */
  aside.ticket{
    border-left:1px solid var(--line);
    background:var(--paper);
    position:sticky;
    top:62px;
    height:calc(100vh - 62px);
    display:flex;
    flex-direction:column;
  }
  .ticket-head{
    padding:16px 18px 10px;
    border-bottom:1px dashed var(--line);
  }
  .ticket-head h3{
    font-family:'Fraunces',serif;
    margin:0 0 2px;
    font-size:17px;
    color:var(--forest-dark);
  }
  .ticket-head .meta{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .ticket-items{
    flex:1;
    overflow-y:auto;
    padding:10px 18px;
  }
  .ticket-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    margin-top:40px;
    padding:0 20px;
    line-height:1.5;
  }
  .ticket-line{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .ticket-line:last-child{ border-bottom:none; }
  .tl-top{ display:flex; justify-content:space-between; gap:8px; }
  .tl-name{ font-weight:600; font-size:13.5px; color:var(--ink); }
  .tl-price{ font-family:'Space Mono',monospace; font-size:13px; color:var(--forest-dark); font-weight:700; white-space:nowrap;}
  .tl-mods{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}
  .tl-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
  }
  .qty-group{ display:flex; align-items:center; gap:8px; }
  .qty-btn{
    width:24px; height:24px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--cream);
    cursor:pointer;
    font-family:'Space Mono',monospace;
    font-size:14px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
  }
  .qty-btn:hover{ background:var(--sage); }
  .qty-val{ font-family:'Space Mono',monospace; font-size:13px; min-width:16px; text-align:center;}
  .remove-btn{
    background:none;
    border:none;
    color:var(--danger);
    font-size:11.5px;
    cursor:pointer;
    text-decoration:underline;
    font-family:'Inter',sans-serif;
  }

  .ticket-footer{
    border-top:1px dashed var(--line);
    padding:14px 18px 18px;
  }
  .totals-row{
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .totals-row.grand{
    font-size:18px;
    color:var(--ink);
    font-weight:700;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--line);
  }
  .send-btn{
    width:100%;
    margin-top:14px;
    background:var(--coral);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:.2px;
    cursor:pointer;
    transition:background .15s;
  }
  .send-btn:hover{ background:var(--coral-dark); }
  .send-btn:disabled{ background:#D8CFBE; cursor:not-allowed; }
  .clear-btn{
    width:100%;
    margin-top:8px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:9px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    cursor:pointer;
  }
  .clear-btn:hover{ background:var(--cream); }

  /* ---------- Modifier modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(32,52,42,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--paper);
    border-radius:16px;
    width:100%;
    max-width:420px;
    max-height:85vh;
    overflow-y:auto;
    padding:22px;
  }
  .modal h3{
    font-family:'Fraunces',serif;
    font-size:19px;
    margin:0 0 2px;
    color:var(--forest-dark);
  }
  .modal .modal-desc{ font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; line-height:1.4;}
  .modal .group-title{
    font-family:'Space Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--forest-dark);
    margin:14px 0 8px;
  }
  .modal-qty-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 12px;
  }
  .modal-qty-row .qty-label{ font-size:13px; font-weight:600; color:var(--ink); }
  .modal-qty-row .qty-group{ display:flex; align-items:center; gap:12px; }
  .modal-qty-row .qty-btn{
    width:26px; height:26px;
    border-radius:50%;
    border:none;
    background:var(--forest);
    color:var(--cream);
    font-family:'Space Mono',monospace;
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-qty-row .qty-btn:hover{ background:var(--forest-dark); }
  .modal-qty-row .qty-val{ font-family:'Space Mono',monospace; font-size:14px; font-weight:700; min-width:16px; text-align:center; }

  .unit-block{
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px 14px;
    margin-top:14px;
    background:var(--cream);
  }
  .unit-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:2px;
  }
  .unit-head .unit-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:14.5px;
    color:var(--forest-dark);
  }
  .unit-copy-link{
    background:none;
    border:none;
    color:var(--coral-dark);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .unit-block .group-title{ margin:10px 0 6px; font-size:10px; }
  .unit-block .opt-row{ padding:7px 9px; margin-bottom:5px; font-size:12.5px; }
  .unit-block textarea{ margin-top:4px; min-height:36px; font-size:12.5px; }
  .unit-price-tag{
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    color:var(--coral-dark);
    font-weight:700;
  }
  .opt-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:9px;
    margin-bottom:7px;
    cursor:pointer;
    font-size:13.5px;
  }
  .opt-row input{ margin-right:10px; }
  .opt-row .opt-price{ font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-soft); }
  .opt-row.checked{ border-color:var(--forest); background:var(--sage); }
  .opt-row.allergy.checked{ border-color:var(--danger); background:#FBEAE6; }
  .opt-row.choice.checked{ border-color:var(--coral); background:#FBEBE0; }
  .group-required{
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:600;
    color:var(--coral-dark);
    margin-left:6px;
    text-transform:none;
    letter-spacing:0;
  }
  .modal textarea{
    width:100%;
    margin-top:6px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:9px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    resize:vertical;
    min-height:50px;
  }
  .modal-footer{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .modal-footer button{
    flex:1;
    padding:11px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    border:none;
  }
  .modal-cancel{ background:var(--cream); color:var(--ink-soft); border:1px solid var(--line) !important;}
  .modal-confirm{ background:var(--forest); color:var(--cream); }
  .modal-price-live{ font-family:'Space Mono',monospace; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--forest-dark);
    color:var(--cream);
    padding:12px 20px;
    border-radius:10px;
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Table select screen ---------- */
  .table-select-screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 60px;
  }
  .tss-header{
    text-align:center;
    margin-bottom:28px;
  }
  .tss-header .mark{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:26px;
    color:var(--forest-dark);
  }
  .tss-header .sub{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-top:4px;
  }
  .tss-prompt{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    margin:18px 0 14px;
  }
  .table-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    width:100%;
    max-width:480px;
  }
  .table-btn{
    position:relative;
    aspect-ratio:1;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    color:var(--ink);
    transition:transform .1s, box-shadow .15s, border-color .15s;
  }
  .table-btn:hover{ box-shadow:0 4px 14px rgba(47,74,61,.12); }
  .table-btn:active{ transform:scale(.96); }
  .table-btn .tb-sub{
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .table-btn.has-order{
    border-color:var(--coral);
    background:#FFF6EF;
  }
  .table-btn.has-order .tb-sub{ color:var(--coral-dark); font-weight:700; }
  .table-btn .tb-count{
    position:absolute;
    top:-8px; right:-8px;
    background:var(--coral);
    color:#fff;
    font-family:'Space Mono',monospace;
    font-size:11px;
    font-weight:700;
    min-width:22px;
    height:22px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 5px;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .custom-table-row{
    display:flex;
    gap:10px;
    margin-top:22px;
    width:100%;
    max-width:480px;
  }
  .custom-table-row input{
    flex:1;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .custom-table-row button{
    background:var(--forest);
    color:var(--cream);
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .custom-table-row button:hover{ background:var(--forest-dark); }

  #orderScreen{ display:none; }

  /* ---------- Mobile ---------- */
  .cart-toggle{ display:none; }
  @media (max-width: 980px){
    .app{ grid-template-columns:1fr; }
    .filter-bar{ padding:12px 14px 8px; top:62px; }
    aside.ticket{
      position:fixed;
      bottom:0; left:0; right:0;
      top:auto;
      height:auto;
      max-height:0;
      overflow:hidden;
      border-left:none;
      border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;
      box-shadow:0 -6px 24px rgba(0,0,0,.15);
      transition:max-height .25s ease;
      z-index:60;
    }

      { name:"Mrs. Peck", desc:"6 chicken balls, leafy greens, avocado, fruit.", price:13.90, group:"food" },
    ]
  },
];

const FILTERS = [
  {id:"all", label:"All"},
  {id:"food", label:"Food"},
  {id:"pancake", label:"Pancake"},
  {id:"bowl", label:"Bowl"},
  {id:"drink", label:"Drinks"},
];

/* ---------------------------------------------------------------
   STATE
   Every table keeps its own order array, keyed by table id, so
   switching tables never loses what's already been added elsewhere.
   `order` is always kept as a live alias to orders[currentTable] —
   lines are mutated in place (push/splice/length=0) rather than
   reassigned, so the alias never goes stale.
--------------------------------------------------------------- */
let orders = {};        // tableId -> array of order lines
let tableMeta = {};      // tableId -> {guests: ""}
let currentTable = null;
let order = [];          // alias of orders[currentTable]
let activeFilter = "all";
let activeSearch = "";
let pendingItem = null;
let pendingQty = 1;
let pendingUnits = []; // one entry per unit: {selections:[{key,label,price}], note:""}

/* A line's "key" identifies its exact configuration (name + mods + note).
   Two additions with the same key merge into one line with a combined qty,
   instead of piling up duplicate rows — e.g. two separate "gluten free"
   Pancake Bouquets become one line reading ×2, while a "granola free" one
   stays its own line. */
function lineKey(name, mods, note){
  const modsPart = mods.map(m=>m.label).sort().join(",");
  return `${name}::${modsPart}::${note.trim()}`;
}

/* ---------------------------------------------------------------
   TABLE SELECTION
--------------------------------------------------------------- */
const TABLE_COUNT = 16; // adjust to match how many numbered tables the venue has
const tableSelectScreen = document.getElementById("tableSelectScreen");
const orderScreen = document.getElementById("orderScreen");
const tableGrid = document.getElementById("tableGrid");

function orderTotalFor(tableId){
  const lines = orders[tableId] || [];
  return lines.reduce((s,l)=>s+l.qty,0);
}

function renderTableGrid(){
  let html = "";
  for(let i=1; i<=TABLE_COUNT; i++){
    const count = orderTotalFor(i);
    html += `
      <button class="table-btn ${count>0?"has-order":""}" data-table="${i}">
        ${count>0 ? `<span class="tb-count">${count}</span>` : ""}
        ${i}
        <span class="tb-sub">${count>0 ? count+" items" : "table"}</span>
      </button>
    `;
  }
  tableGrid.innerHTML = html;
  tableGrid.querySelectorAll(".table-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> selectTable(btn.dataset.table));
  });
}

function selectTable(id){
  id = String(id).trim();
  if(!id) return;
  currentTable = id;
  if(!orders[id]) orders[id] = [];
  order = orders[id];
  if(!tableMeta[id]) tableMeta[id] = {guests:""};

  document.getElementById("activeTableLabel").textContent = id;
  document.getElementById("guestCount").value = tableMeta[id].guests;

  tableSelectScreen.style.display = "none";
  orderScreen.style.display = "block";

  renderMenu();
  renderTicket();
  window.scrollTo(0,0);
}

function goToTableSelect(){
  currentTable = null;
  orderScreen.style.display = "none";
  tableSelectScreen.style.display = "flex";
  renderTableGrid();
}

document.getElementById("switchTableBtn").addEventListener("click", goToTableSelect);
document.getElementById("customTableBtn").addEventListener("click", ()=>{
  const val = document.getElementById("customTableInput").value.trim();
  if(val) selectTable(val);
});
document.getElementById("customTableInput").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") document.getElementById("customTableBtn").click();
});

const fmt = n => n.toFixed(2).replace(".", ",") + "€";

// Escapes a string for safe use inside an HTML attribute (e.g. data-name="...").
// Needed because a couple of dish names contain literal quote characters
// (the Special Menu items), which would otherwise break the attribute.
function escapeAttr(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ---------------------------------------------------------------
   FILTER BAR
--------------------------------------------------------------- */
const filterBar = document.getElementById("filterBar");
function renderFilterBar(){
  filterBar.innerHTML = FILTERS.map(f=>
    `<button class="filter-pill ${f.id===activeFilter?"active":""}" data-filter="${f.id}">${f.label}</button>`
  ).join("");
  filterBar.querySelectorAll(".filter-pill").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeFilter = btn.dataset.filter;
      renderFilterBar();
      renderMenu();
    });
  });
}

/* ---------------------------------------------------------------
   RENDER MENU
--------------------------------------------------------------- */
const menuContainer = document.getElementById("menuContainer");

function itemMatchesFilter(item){
  if(activeFilter === "all") return true;
  return item.group === activeFilter;
}
function itemMatchesSearch(item){
  const f = activeSearch.trim().toLowerCase();
  if(!f) return true;
  return item.name.toLowerCase().includes(f) || item.desc.toLowerCase().includes(f);
}

function renderMenu(){
  // Flat, header-less grid for pancake / bowl / drink filters
  if(activeFilter === "pancake" || activeFilter === "bowl" || activeFilter === "drink"){
    const flat = [];
    MENU.forEach(cat=> cat.items.forEach(it=>{ if(itemMatchesFilter(it) && itemMatchesSearch(it)) flat.push(it); }));

    if(flat.length === 0){
      const label = FILTERS.find(f=>f.id===activeFilter).label;
      menuContainer.innerHTML = `
        <div class="empty-state">
          <span class="big">🍽️</span>
          No ${label.toLowerCase()} items ${activeSearch ? "match your search" : "on the menu yet"}.
        </div>`;
    } else {
      menuContainer.innerHTML = `<div class="item-grid">${flat.map(itemCardHTML).join("")}</div>`;
    }
    attachCardHandlers();
    return;
  }

  // Grouped view for "All" and "Food"
  let html = "";
  MENU.forEach(cat=>{
    const items = cat.items.filter(it=>{
      if(activeFilter === "food" && it.group !== "food") return false;
      return itemMatchesSearch(it);
    });
    if(items.length === 0) return;
    html += `
      <section class="category-block">
        <div class="category-head"><h2>${cat.name}</h2></div>
        ${cat.note ? `<div class="category-note">${cat.note}</div>` : ""}
        <div class="item-grid">${items.map(itemCardHTML).join("")}</div>
      </section>
    `;
  });
  menuContainer.innerHTML = html || `<div class="empty-state"><span class="big">🔍</span>No dishes match your search.</div>`;
  attachCardHandlers();
}

function itemCardHTML(it){
  const tag = it.tag ? `<span class="tag">${it.tag}</span>` : "";
  const qty = defaultQtyFor(it.name);
  const totalQty = totalQtyForItem(it.name);
  return `
    <div class="item-card ${it.special ? "special":""}" data-item="${escapeAttr(it.name)}">
      <div class="item-top">
        <div class="item-name">${it.name}</div>
      </div>
      ${tag}
      ${totalQty>0 ? `<span class="ticket-badge">🧾 ${totalQty} on ticket</span>` : ""}
      <div class="card-bottom">
        <button class="customize-link" data-name="${escapeAttr(it.name)}">Customize / allergies</button>
        <div class="qty-stepper" data-name="${escapeAttr(it.name)}">
          <button class="step-btn minus" ${qty===0?"disabled":""}>−</button>
          <span class="step-val">${qty}</span>
          <button class="step-btn plus">+</button>
        </div>
      </div>
    </div>
  `;
}

function findItemByName(name){
  for(const cat of MENU){
    const it = cat.items.find(i=>i.name===name);
    if(it) return it;
  }
  return null;
}

function attachCardHandlers(){
  menuContainer.querySelectorAll(".customize-link").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const item = findItemByName(btn.dataset.name);
      openItemModal(item);
    });
  });
  menuContainer.querySelectorAll(".qty-stepper").forEach(stepper=>{
    const name = stepper.dataset.name;
    stepper.querySelector(".plus").addEventListener("click", ()=> bumpPlainLine(name, 1));
    stepper.querySelector(".minus").addEventListener("click", ()=> bumpPlainLine(name, -1));
  });
}

/* ---------------------------------------------------------------
   LINE MERGING — any add (plain card stepper or a customized modal
   add) goes through here, so two identical configurations combine
   into one line with qty > 1, while different configurations of the
   same dish stay as separate lines.
--------------------------------------------------------------- */
function addOrUpdateLine(item, mods, note, qtyDelta){
  const key = lineKey(item.name, mods, note);
  let line = order.find(l=>l.key===key);
  if(!line){
    if(qtyDelta <= 0) return;
    const unitPrice = item.price + mods.reduce((s,m)=>s+m.price,0);
    line = { uid: Date.now()+"-"+Math.random().toString(36).slice(2,7), name:item.name, basePrice:item.price, mods, unitPrice, qty:0, note, key };
    order.push(line);
  }
  line.qty += qtyDelta;
  if(line.qty <= 0){
    const idx = order.indexOf(line);
    if(idx > -1) order.splice(idx, 1);
  }
}

/* The card's own +/- stepper always targets the plain (no modifier,
   no note) configuration of that dish. */
function defaultQtyFor(name){
  const line = order.find(l=>l.name===name && l.mods.length===0 && !l.note);
  return line ? line.qty : 0;
}

function bumpPlainLine(name, delta){
  const item = findItemByName(name);
  addOrUpdateLine(item, [], "", delta);
  renderTicket();
  refreshCardSteppers();
}

/* Total quantity of a dish across ALL its configurations combined —
   e.g. 1 gluten-free + 1 granola-free + 2 plain Pancake Bouquets = 4. */
function totalQtyForItem(name){
  return order.filter(l=>l.name===name).reduce((s,l)=>s+l.qty,0);
}

/* Re-render the menu grid from current state, so every card's stepper
   value and "on ticket" badge always reflects the order exactly —
   simpler and less error-prone than patching individual DOM nodes. */
function refreshCardSteppers(){
  renderMenu();
}

/* ---------------------------------------------------------------
   MODIFIER MODAL (customization, incl. allergy flags)
--------------------------------------------------------------- */
const overlay = document.getElementById("overlay");
const modalBody = document.getElementById("modalBody");

function openItemModal(item){
  pendingItem = item;
  pendingQty = 1;
  pendingUnits = [{selections:[], note:""}];
  renderModal();
  overlay.classList.add("open");
}
function closeModal(){
  overlay.classList.remove("open");
  pendingItem = null;
}
function unitPrice(unit){
  return pendingItem.price + unit.selections.reduce((s,m)=>s+m.price,0);
}
function totalAllUnits(){
  return pendingUnits.reduce((s,u)=>s+unitPrice(u),0);
}

function setQty(newQty){
  newQty = Math.max(1, newQty);
  if(newQty > pendingQty){
    for(let i=pendingQty; i<newQty; i++) pendingUnits.push({selections:[], note:""});
  } else if(newQty < pendingQty){
    pendingUnits = pendingUnits.slice(0, newQty);
  }
  pendingQty = newQty;
  renderModal();
}

function renderModal(){
  const it = pendingItem;

  const optionGroupHTML = (unitIdx, title, list, keyPrefix, extraClass="", single=false) => {
    if(!list || list.length===0) return "";
    const unit = pendingUnits[unitIdx];
    const requiredTag = single ? `<span class="group-required">choose one</span>` : "";
    return `
      <div class="group-title">${title}${requiredTag}</div>
      ${list.map((opt, i)=>{
        const key = keyPrefix+i;
        const checked = unit.selections.some(s=>s.key===key);
        return `
          <label class="opt-row ${extraClass} ${checked?"checked":""}" data-unit="${unitIdx}" data-key="${key}" data-group="${keyPrefix}" data-single="${single}" data-label="${opt.label}" data-price="${opt.price}">
            <span><input type="${single?"radio":"checkbox"}" ${checked?"checked":""}/> ${opt.label}</span>
            <span class="opt-price">${opt.price>0 ? "+"+fmt(opt.price) : ""}</span>
          </label>
        `;
      }).join("")}
    `;
  };

  const unitsHTML = pendingUnits.map((unit, idx)=>{
    const copyLink = idx>0 ? `<button class="unit-copy-link" data-copy-to="${idx}">Copy from Guest 1</button>` : "";
    const choiceGroupsHTML = (it.choiceGroups || []).map(g =>
      optionGroupHTML(idx, g.title, g.choices, "cg-"+g.key+"-", "choice", true)
    ).join("");
    return `
      <div class="unit-block">
        <div class="unit-head">
          <span class="unit-title">Guest ${idx+1}</span>
          <span class="unit-price-tag">${fmt(unitPrice(unit))}</span>
        </div>
        ${copyLink}
        ${choiceGroupsHTML}
        ${optionGroupHTML(idx, "Options", it.options, "opt-")}
        ${optionGroupHTML(idx, "Extras", it.extras, "ext-")}
        ${optionGroupHTML(idx, "Add ons", it.addons, "add-")}
        ${optionGroupHTML(idx, "Allergy / dietary flags", ALLERGY_FLAGS, "alg-", "allergy")}
        <div class="group-title">Kitchen note</div>
        <textarea data-note-unit="${idx}" placeholder="e.g. dressing on the side...">${unit.note}</textarea>
      </div>
    `;
  }).join("");

  modalBody.innerHTML = `
    <h3>${it.name}</h3>
    <div class="modal-desc">${it.desc}</div>
    <div class="modal-qty-row">
      <span class="qty-label">How many ${it.name} for this table?</span>
      <div class="qty-group">
        <button class="qty-btn" id="modalQtyMinus" ${pendingQty<=1?"disabled":""}>−</button>
        <span class="qty-val" id="modalQtyVal">${pendingQty}</span>
        <button class="qty-btn" id="modalQtyPlus">+</button>
      </div>
    </div>
    ${unitsHTML}
    <div class="modal-footer">
      <button class="modal-cancel" id="modalCancel">Cancel</button>
      <button class="modal-confirm" id="modalConfirm">Add ${pendingQty>1?"all "+pendingQty+" — ":"— "}<span class="modal-price-live">${fmt(totalAllUnits())}</span></button>
    </div>
  `;

  document.getElementById("modalQtyMinus").addEventListener("click", ()=> setQty(pendingQty-1));
  document.getElementById("modalQtyPlus").addEventListener("click", ()=> setQty(pendingQty+1));

  modalBody.querySelectorAll(".opt-row").forEach(row=>{
    row.addEventListener("click", (e)=>{
      e.preventDefault();
      const unitIdx = parseInt(row.dataset.unit, 10);
      const key = row.dataset.key;
      const group = row.dataset.group;
      const single = row.dataset.single === "true";
      const unit = pendingUnits[unitIdx];
      const existingIdx = unit.selections.findIndex(s=>s.key===key);
      if(single){
        if(existingIdx>-1){
          unit.selections.splice(existingIdx,1); // tap again to clear the pick
        } else {
          unit.selections = unit.selections.filter(s=>!s.key.startsWith(group));
          unit.selections.push({key, label: row.dataset.label, price: parseFloat(row.dataset.price)});
        }
      } else {
        if(existingIdx>-1){
          unit.selections.splice(existingIdx,1);
        } else {
          unit.selections.push({key, label: row.dataset.label, price: parseFloat(row.dataset.price)});
        }
      }
      renderModal();
    });
  });

  modalBody.querySelectorAll("[data-note-unit]").forEach(ta=>{
    ta.addEventListener("input", (e)=>{
      pendingUnits[parseInt(ta.dataset.noteUnit,10)].note = e.target.value;
    });
  });

  modalBody.querySelectorAll("[data-copy-to]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.copyTo, 10);
      pendingUnits[idx] = {
        selections: pendingUnits[0].selections.map(s=>({...s})),
        note: pendingUnits[0].note
      };
      renderModal();
    });
  });

  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalConfirm").addEventListener("click", confirmAddToOrder);
}

function confirmAddToOrder(){
  const item = pendingItem;
  const qty = pendingQty;
  pendingUnits.forEach(unit=>{
    addOrUpdateLine(item, unit.selections, unit.note.trim(), 1);
  });
  closeModal();
  renderTicket();
  refreshCardSteppers();
  showToast(`${qty>1 ? qty+"× " : ""}${item.name} added to ticket`);
}

overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });

/* ---------------------------------------------------------------
   TICKET / ORDER PANEL
--------------------------------------------------------------- */
const ticketItems = document.getElementById("ticketItems");
const totalItemsEl = document.getElementById("totalItems");
const totalPriceEl = document.getElementById("totalPrice");
const sendBtn = document.getElementById("sendBtn");
const ticketMeta = document.getElementById("ticketMeta");
const cartToggleCount = document.getElementById("cartToggleCount");

function renderTicket(){
  if(order.length === 0){
    ticketItems.innerHTML = `<div class="ticket-empty">Tap a dish to add it here.<br>Build the order, then send it to the kitchen.</div>`;
  } else {
    ticketItems.innerHTML = order.map(line=>{
      const modsText = line.mods.length
        ? line.mods.map(m=> m.price>0 ? `${m.label} (+${fmt(m.price)})` : m.label).join(" · ")
        : "";
      return `
        <div class="ticket-line" data-uid="${line.uid}">
          <div class="tl-top">
            <div class="tl-name">${line.name}</div>
            <div class="tl-price">${fmt(line.unitPrice*line.qty)}</div>
          </div>
          ${modsText ? `<div class="tl-mods">${modsText}</div>` : ""}
          ${line.note ? `<div class="tl-mods">📝 ${line.note}</div>` : ""}
          <div class="tl-controls">
            <div class="qty-group">
              <button class="qty-btn" data-action="dec">–</button>
              <span class="qty-val">${line.qty}</span>
              <button class="qty-btn" data-action="inc">+</button>
            </div>
            <button class="remove-btn" data-action="remove">Remove</button>
          </div>
        </div>
      `;
    }).join("");
  }

  ticketItems.querySelectorAll(".ticket-line").forEach(el=>{
    const uid = el.dataset.uid;
    el.querySelector('[data-action="inc"]').addEventListener("click", ()=> changeQty(uid, 1));
    el.querySelector('[data-action="dec"]').addEventListener("click", ()=> changeQty(uid, -1));
    el.querySelector('[data-action="remove"]').addEventListener("click", ()=> removeLine(uid));
  });

  const totalItemsCount = order.reduce((s,l)=>s+l.qty,0);
  const totalPrice = order.reduce((s,l)=>s+l.unitPrice*l.qty,0);
  totalItemsEl.textContent = totalItemsCount;
  totalPriceEl.textContent = fmt(totalPrice);
  cartToggleCount.textContent = totalItemsCount;
  sendBtn.disabled = order.length === 0;

  const guests = document.getElementById("guestCount").value.trim();
  ticketMeta.textContent = currentTable
    ? `Table ${currentTable}${guests ? " · " + guests + " guests" : ""}`
    : "No table selected";
}

function changeQty(uid, delta){
  const line = order.find(l=>l.uid===uid);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0){
    const idx = order.indexOf(line);
    if(idx > -1) order.splice(idx, 1);
  }
  renderTicket();
  refreshCardSteppers();
}

function removeLine(uid){
  const idx = order.findIndex(l=>l.uid===uid);
  if(idx > -1) order.splice(idx, 1);
  renderTicket();
  refreshCardSteppers();
}

document.getElementById("clearBtn").addEventListener("click", ()=>{
  if(order.length===0) return;
  if(confirm("Clear the entire order for this table?")){
    order.length = 0;
    renderTicket();
    refreshCardSteppers();
  }
});

sendBtn.addEventListener("click", ()=>{
  if(!currentTable || order.length===0) return;
  const totalPrice = order.reduce((s,l)=>s+l.unitPrice*l.qty,0);
  const sentTable = currentTable;
  showToast(`Order sent for Table ${sentTable} — ${fmt(totalPrice)}`);
  order.length = 0;
  goToTableSelect();
});

document.getElementById("guestCount").addEventListener("input", (e)=>{
  if(currentTable) tableMeta[currentTable].guests = e.target.value;
  renderTicket();
});

/* ---------------------------------------------------------------
   MOBILE CART TOGGLE
--------------------------------------------------------------- */
const ticketPanel = document.getElementById("ticketPanel");
document.getElementById("cartToggle").addEventListener("click", ()=>{
  ticketPanel.classList.toggle("open");
});

/* ---------------------------------------------------------------
   SEARCH
--------------------------------------------------------------- */
document.getElementById("searchBox").addEventListener("input", (e)=>{
  activeSearch = e.target.value;
  renderMenu();
});

/* ---------------------------------------------------------------
   TOAST
--------------------------------------------------------------- */
let toastTimer;
function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove("show"), 2400);
}

/* ---------------------------------------------------------------
   CLOCK
--------------------------------------------------------------- */
function tickClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  document.getElementById("clockBadge").textContent = `${hh}:${mm}`;
}
tickClock();
setInterval(tickClock, 15000);

/* ---------------------------------------------------------------
   INIT — start on the table-select screen; the order pad itself
   only becomes visible once a table has been chosen.
--------------------------------------------------------------- */
renderFilterBar();
renderTableGrid();
</script>
