  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    overflow-anchor:none;
    margin:0;
    background:var(--cui-bg-normal);
    color:var(--cui-fg-normal);
    font-family:var(--cui-font-stack-default);
    font-weight:var(--cui-font-weight-regular);
    font-size:var(--cui-body-m-font-size);
    line-height:var(--cui-body-m-line-height);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--cui-bg-highlight); color:var(--cui-fg-normal);}
  button{font-family:var(--cui-font-stack-default);}
  input,textarea{font-family:var(--cui-font-stack-default); font-weight:var(--cui-font-weight-regular);}
  button:focus-visible, .table-btn:focus-visible{
    outline:var(--cui-border-width-mega) solid var(--cui-border-focus);
    outline-offset:var(--cui-border-width-mega);
  }

  /* ---------- Header ---------- */
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 16px;
    background:var(--cui-bg-normal);
    color:var(--cui-fg-normal);
    border-bottom:1px solid var(--cui-border-divider);
    position:static;
  }
  .table-badge{
    display:flex;
    align-items:baseline;
    gap:8px;
    line-height:1.2;
  }
  .table-badge .tb-value{
    font-family:var(--cui-font-stack-display);
    font-weight:bold;
    font-size:var(--cui-headline-m-font-size);
    line-height:var(--cui-headline-m-line-height);
    color:var(--cui-fg-normal);
  }
  .table-badge .tb-label{
    font-size:var(--cui-compact-s-font-size);
    line-height:var(--cui-compact-s-line-height);
    font-weight:var(--cui-font-weight-semibold);
    color:var(--cui-fg-subtle);
  }
  /* Button / secondary / size s */
  .switch-table-btn{
    background:var(--cui-bg-normal);
    border:var(--cui-border-width-kilo) solid var(--cui-border-normal);
    color:var(--cui-fg-normal);
    padding:calc(var(--cui-spacings-bit) - 1px) calc(var(--cui-spacings-kilo) - 1px);
    border-radius:var(--cui-border-radius-byte);
    font-weight:var(--cui-font-weight-semibold);
    font-size:var(--cui-body-s-font-size);
    line-height:var(--cui-body-s-line-height);
    cursor:pointer;
    transition:color var(--cui-transitions-default), background-color var(--cui-transitions-default), border-color var(--cui-transitions-default);
  }
  .switch-table-btn:hover{ background:var(--cui-bg-subtle-hovered); border-color:var(--cui-border-normal-hovered); }
  .switch-table-btn:active{ background:var(--cui-bg-subtle-pressed); border-color:var(--cui-border-normal-pressed); }

  /* ---------- Layout ---------- */
  .app{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:0;
    min-height:100vh;
  }

  /* ---------- Food / Drinks swipeable pages (Circuit Tabs) ---------- */
  .pages-viewport{
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .page-tabs{
    position:sticky;
    top:0;
    z-index:36;
    display:flex;
    background:var(--cui-bg-normal);
    border-bottom:var(--cui-border-width-kilo) solid var(--cui-border-subtle);
  }
  .page-tab{
    flex:1;
    border:none;
    background:none;
    padding:var(--cui-spacings-kilo) var(--cui-spacings-bit);
    font-weight:var(--cui-font-weight-semibold);
    font-size:var(--cui-body-s-font-size);
    line-height:var(--cui-body-s-line-height);

  /* ---------- Chat-style ordering ---------- */

  .chat-suggestions{

  /* Circuit Tag (interactive) */
  .chat-tag{

    font-size:var(--cui-body-s-font-size);
    line-height:var(--cui-body-s-line-height);

  /* Circuit NotificationInline (neutral) */
  .chat-preview{
    width:100%;

  .chat-tag-group{ width:100%; }
  .chat-tag-label{
    font-size:var(--cui-compact-s-font-size);

  html:has(body.chat-mode), body.chat-mode{ overflow:hidden; overscroll-behavior:none; }

  /* Circuit Input (size m) */
  .search-row input{

  }

  section.category-block{ margin-bottom:34px; scroll-margin-top:130px; }

  .item-grid{

  /* Circuit Card */
  .item-card{

    border-radius:var(--cui-border-radius-byte);

  /* Circuit tertiary icon button */

  .empty-state{

  /* ---------- Order ticket ---------- */

  .tl-top{ display:flex; justify-content:space-between; gap:8px; }
  .tl-name{

  /* Circuit Badge (success / warning) */

  /* Circuit secondary icon button, size s */

   switching tables never loses what's already been added elsewhere.
   `order` is always kept as a live alias to orders[currentTable] —
   lines are mutated in place (push/splice/length=0) rather than
   reassigned, so the alias never goes stale.
--------------------------------------------------------------- */
let orders = {};        // tableId -> array of order lines
let tableMeta = {};      // tableId -> {guests: ""}
let currentTable = null;
let order = [];          // alias of orders[currentTable]
let activeFilter = "all";
let activeSearch = "";
let pendingItem = null;
let pendingQty = 1;
let pendingUnits = []; // one entry per unit: {selections:[{key,label,price}], note:""}

/* A line's "key" identifies its exact configuration (name + mods + note).
   Two additions with the same key merge into one line with a combined qty,
   instead of piling up duplicate rows — e.g. two separate "gluten free"
   Pancake Bouquets become one line reading ×2, while a "granola free" one
   stays its own line. */
function lineKey(name, mods, note){
  const modsPart = mods.map(m=>m.label).sort().join(",");
  return `${name}::${modsPart}::${note.trim()}`;
}

// table's order (a full move) instead of opening its own order — used
// when a guest physically moves tables mid-order.
let moveMode = false;
let moveModeSourceTable = null;

function orderTotalFor(tableId){
  const lines = orders[tableId] || [];
  return lines.reduce((s,l)=>s+l.qty,0);
}

function renderTableGrid(){
  let html = "";
  for(let i=1; i<=TABLE_COUNT; i++){
    const count = orderTotalFor(i);
    const isSource = moveMode && String(i)===String(moveModeSourceTable);
    html += `
      <button class="table-btn ${count>0?"has-order":""}" data-table="${i}" ${isSource?"disabled":""}>
        ${count>0 ? `<span class="tb-count">${count}</span>` : ""}
        ${i}
        <span class="tb-sub">${isSource ? "current" : (count>0 ? count+" items" : "table")}</span>
      </button>
    `;
  }
  tableGrid.innerHTML = html;
  tableGrid.querySelectorAll(".table-btn:not(:disabled)").forEach(btn=>{
    btn.addEventListener("click", ()=> selectTable(btn.dataset.table));
  });

  if(tssPrompt){
    tssPrompt.innerHTML = moveMode
      ? `Moving Table ${moveModeSourceTable}'s order — pick the new table <button class="unit-copy-link" id="cancelMoveBtn" style="margin-left:8px;">Cancel</button>`
      : "Select a table to start the order";
    const cancelBtn = document.getElementById("cancelMoveBtn");
    if(cancelBtn) cancelBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      moveMode = false;
      selectTable(moveModeSourceTable);
    });
  }

function selectTable(id){
  id = String(id).trim();
  if(!id) return;

  if(moveMode){
    const source = moveModeSourceTable;
    if(id === source){ moveMode = false; }
    else {
      if(orders[id] && orders[id].length > 0){
        const ok = confirm(`Table ${id} already has an order in progress. Merge Table ${source}'s order into it?`);
        if(!ok) return;
        orders[id] = orders[id].concat(orders[source]);
      } else {
        orders[id] = orders[source];
      }
      tableMeta[id] = tableMeta[source] || {guests:""};
      delete orders[source];
      delete tableMeta[source];
      moveMode = false;
      showToast(`Order moved from Table ${source} to Table ${id}`);
    }
  }

  currentTable = id;
  if(!orders[id]) orders[id] = [];
  order = orders[id];
  if(!tableMeta[id]) tableMeta[id] = {guests:""};

  document.getElementById("activeTableLabel").textContent = id;
  document.getElementById("guestCount").value = tableMeta[id].guests;

  tableSelectScreen.style.display = "none";
  orderScreen.style.display = "block";

  renderMenu();
  renderDrinksMenu();
  renderTicket();
  window.scrollTo(0,0);
}

// Escapes a string for safe use inside an HTML attribute (e.g. data-name="...").

    .replace(/&/g, "&amp;")

function findItemByName(name){

    if(it) return it;

/* ---------------------------------------------------------------
   CHAT-STYLE ORDERING — a 3rd way to build the same order as the
   Food/Drinks grids (it's just another entry point into
   addOrUpdateLine/openItemModal, never a separate data model). The
   waiter types a dish/drink name, gets tappable suggestion tags, and
   tapping one opens the normal customize sheet. The chat log itself
   is just the existing `order` array rendered as bubbles, so it's
   always exactly in sync with the ticket — no separate state to
   drift out of date.
--------------------------------------------------------------- */
const ALL_ITEMS_FLAT = [...MENU, ...DRINKS_MENU].flatMap(cat => cat.items);

// Lowercases and turns punctuation/hyphens/quotes into spaces, so
// "Eggo-Cardo" and "eggo cardo" compare as equal.
function normText(s){
  return String(s).toLowerCase().replace(/[^a-z0-9äöüß]+/g, " ").trim();
}

// Small Levenshtein distance so a typo'd/partial name ("pancke",
// "blue lagoo") still resolves to the right dish instead of coming up
// empty.
function levenshtein(a, b){
  a = a.toLowerCase(); b = b.toLowerCase();
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, ()=> new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0] = i;
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      if(a[i-1]===b[j-1]) dp[i][j] = dp[i-1][j-1];
      else dp[i][j] = 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

// Scores a menu item against the typed query: 0 = no match at all,
// higher = better match. Exact match and "starts with" rank highest
// (so typing "pan" favors "Pancake Bouquet" over something merely
// typo-close), substring match next, then typo-tolerant distance
// against the name and against each individual word in it (so
// "lagoo" still finds "Blue Lagoon Bowl").
function fuzzyScore(query, name){
  const q = normText(query);
  const n = normText(name);
  if(!q) return 0;
  if(q === n) return 1000;
  if(n.startsWith(q)) return 900 - (n.length - q.length);
  if(n.includes(q)) return 700 - (n.length - q.length);

  const words = n.split(/\s+/);
  let best = 0;
  for(const w of words){
    if(w.startsWith(q)) best = Math.max(best, 650 - (w.length - q.length));
  }
  if(best > 0) return best;

  // Typo tolerance: allow roughly up to a third of the query length
  // in edits before giving up, scaled so closer matches score higher.
  const maxEdits = Math.max(1, Math.floor(q.length / 3));
  const wholeDist = levenshtein(q, n);
  let minWordDist = Infinity;
  for(const w of words) minWordDist = Math.min(minWordDist, levenshtein(q, w));
  const dist = Math.min(wholeDist, minWordDist);
  if(dist <= maxEdits) return 400 - dist*40;
  return 0;
}

// Returns the best-matching items for a typed query, best first.
function searchItems(query, limit){
  if(!query || !query.trim()) return [];
  const scored = ALL_ITEMS_FLAT
    .map(it => ({ it, score: fuzzyScore(query, it.name) }))
    .filter(x => x.score > 0)
    .sort((a,b)=> b.score - a.score);
  return scored.slice(0, limit || 6).map(x => x.it);
}

   station's phone (kitchen-display.html) only ever sees its own

   To activate: create a free Firebase project at

   then Project settings → your web app → copy the config values in

--------------------------------------------------------------- */
const FIREBASE_CONFIG = {

let kitchenDb = null;
if(FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY"){
  try{

  } catch(e){

// Station routing — matches how the 3 kitchen phones are staffed:
//  · pancakeBowlSmoothie: pancakes, smoothie bowls, natural smoothies
//  · hotFoodEggsSalad: every egg dish + the salads (the "food" group)
//  · drinks: water, everyday coffees, and the Super Special warm drinks
function stationForItemName(name){
  const it = findItemByName(name);
  if(!it) return null;
  if(it.group === "pancake" || it.group === "bowl" || it.group === "smoothie") return "pancakeBowlSmoothie";
  if(it.group === "food") return "hotFoodEggsSalad";
  if(["cooldrink","water","warmdrink","specialwarm"].includes(it.group)) return "drinks";
  return null;
}

// Returns a Promise that resolves once Firebase has confirmed every
// station write, and rejects with the real reason (e.g. the database
// rules refusing the write) — so the waiter is never told "sent" when
// the kitchen didn't actually get it.
function broadcastOrderToKitchen(tableId, guests, lines){
  if(!kitchenDb){
    return Promise.reject(new Error("Kitchen connection didn't load (no internet, or Firebase blocked)."));
  }
  const writes = [];
  const buckets = {pancakeBowlSmoothie:[], hotFoodEggsSalad:[], drinks:[]};
  lines.forEach(line=>{
    const station = stationForItemName(line.name);
    if(!station) return;
    buckets[station].push({
      name: line.name,
      qty: line.qty,
      mods: line.mods.map(m=>m.label),
      note: line.note || ""
    });
  });
  Object.keys(buckets).forEach(station=>{
    if(buckets[station].length === 0) return;
    writes.push(kitchenDb.ref("stationOrders/"+station).push({
      table: tableId,
      guests: guests || "",
      createdAt: Date.now(),
      status: "pending",
      items: buckets[station]
    }));
  });
  if(writes.length === 0){
    return Promise.reject(new Error("None of these items is assigned to a kitchen station."));
  }
  return Promise.all(writes);
}

function attachCardHandlers(container){
  container.querySelectorAll(".customize-icon-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const item = findItemByName(btn.dataset.name);
      openItemModal(item);
    });
  });
  container.querySelectorAll(".qty-stepper").forEach(stepper=>{
    const name = stepper.dataset.name;
    stepper.querySelector(".plus").addEventListener("click", ()=> bumpPlainLine(name, 1));
    stepper.querySelector(".minus").addEventListener("click", ()=> bumpPlainLine(name, -1));
  });
}

/* ---------------------------------------------------------------
   LINE MERGING — any add (plain card stepper or a customized modal
   add) goes through here, so two identical configurations combine
   into one line with qty > 1, while different configurations of the
   same dish stay as separate lines.
--------------------------------------------------------------- */
function addOrUpdateLine(item, mods, note, qtyDelta){
  const key = lineKey(item.name, mods, note);
  let line = order.find(l=>l.key===key);
  if(!line){
    if(qtyDelta <= 0) return;
    const unitPrice = item.price + mods.reduce((s,m)=>s+m.price,0);
    line = { uid: Date.now()+"-"+Math.random().toString(36).slice(2,7), name:item.name, basePrice:item.price, mods, unitPrice, qty:0, note, key, sentQty:0 };
    order.push(line);
  }
  line.qty += qtyDelta;
  if(line.qty <= 0){
    const idx = order.indexOf(line);
    if(idx > -1) order.splice(idx, 1);
  } else {
    line.sentQty = Math.min(line.sentQty, line.qty); // can't have "sent" more than what's left
  }
}

/* The card's own +/- stepper always targets the plain (no modifier,
   no note) configuration of that dish. */
function defaultQtyFor(name){
  const line = order.find(l=>l.name===name && l.mods.length===0 && !l.note);
  return line ? line.qty : 0;
}

function bumpPlainLine(name, delta){
  const item = findItemByName(name);
  addOrUpdateLine(item, [], "", delta);
  renderTicket();
  refreshCardSteppers();
}

/* Total quantity of a dish across ALL its configurations combined —
   e.g. 1 gluten-free + 1 granola-free + 2 plain Pancake Bouquets = 4. */
function totalQtyForItem(name){
  return order.filter(l=>l.name===name).reduce((s,l)=>s+l.qty,0);
}

/* Re-render both pages' grids from current state, so every card's
   stepper value and "in-order" tint always reflects the order exactly
   — simpler and less error-prone than patching individual DOM nodes.
   Both pages stay mounted in the DOM (for the swipe animation), so
   both need refreshing regardless of which one is currently visible. */
function refreshCardSteppers(){
  renderMenu();
  renderDrinksMenu();
}

// Tapping an item's message in the chat reopens the customize sheet
// pre-filled with that line's current configuration; confirming
// replaces the line instead of adding a second one.
let editingLine = null;
function openLineForEdit(uid){
  const line = order.find(l=>l.uid===uid);
  if(!line) return;
  const item = findItemByName(line.name);
  if(!item) return;
  openItemModal(item);
  pendingQty = line.qty;
  pendingUnits = Array.from({length:line.qty}, ()=>({
    selections: line.mods.map(m=>({...m})),
    note: line.note || ""
  }));
  editingLine = { uid:line.uid, key:line.key, sentQty:line.sentQty };
  renderModal();
}
function unitPrice(unit){
  return pendingItem.price + unit.selections.reduce((s,m)=>s+m.price,0);
}
function totalAllUnits(){
  return pendingUnits.reduce((s,u)=>s+unitPrice(u),0);
}

// Minus at quantity 1 = zero: an item that's already on the ticket
// (opened from its chat message) is removed from the order; a new item
// simply isn't added and the sheet closes.
function removeFromSheetAtZero(){
  const edited = editingLine;
  const name = pendingItem ? pendingItem.name : "";
  if(edited){
    const idx = order.findIndex(l=>l.uid===edited.uid);
    if(idx > -1) order.splice(idx, 1);
    closeSheetAnimated();
    renderTicket();
    if(typeof refreshCardSteppers === "function") refreshCardSteppers();
    showToast(edited.sentQty > 0
      ? `${name} removed — it was already sent, tell the kitchen`
      : `${name} removed from the order`, edited.sentQty > 0 ? 5000 : 2400);
  } else {
    closeSheetAnimated();
  }
}

function setQty(newQty){
  newQty = Math.max(1, newQty);
  if(newQty > pendingQty){
    for(let i=pendingQty; i<newQty; i++) pendingUnits.push({selections:[], note:""});
  } else if(newQty < pendingQty){
    pendingUnits = pendingUnits.slice(0, newQty);
  }
  pendingQty = newQty;
  renderModal();
}

function renderModal(){

  const optionGroupHTML = (unitIdx, title, list, keyPrefix, extraClass="", single=false) => {
    if(!list || list.length===0) return "";
    const unit = pendingUnits[unitIdx];
    const requiredTag = single ? `<span class="group-required">choose one</span>` : "";
    return `
      <div class="group-title">${title}${requiredTag}</div>
      ${list.map((opt, i)=>{
        const key = keyPrefix+i;
        const checked = unit.selections.some(s=>s.key===key);
        return `
          <label class="opt-row ${extraClass} ${checked?"checked":""}" data-unit="${unitIdx}" data-key="${key}" data-group="${keyPrefix}" data-single="${single}" data-label="${opt.label}" data-price="${opt.price}">
            <span><input type="${single?"radio":"checkbox"}" ${checked?"checked":""}/> ${opt.label}</span>
            <span class="opt-price">${opt.price>0 ? "+"+fmt(opt.price) : ""}</span>
          </label>
        `;
      }).join("")}
    `;
  };

  const unitsHTML = pendingUnits.map((unit, idx)=>{
    const copyLink = idx>0 ? `<button class="unit-copy-link" data-copy-to="${idx}">Copy from Item 1</button>` : "";
    const choiceGroupsHTML = (it.choiceGroups || []).map(g =>
      optionGroupHTML(idx, g.title, g.choices, "cg-"+g.key+"-", "choice", true)
    ).join("");
    // Only label units when there's more than one (e.g. 3 pancakes with
    // different configs) — with a single unit, the dish name in the
    // sheet's own title is identification enough, so skip the extra
    // heading and keep the sheet shorter.
    const unitHead = pendingUnits.length > 1
      ? `<div class="unit-head"><span class="unit-title">Item ${idx+1}</span><span class="unit-price-tag">${fmt(unitPrice(unit))}</span></div>`
      : `<div class="unit-head unit-head-single"><span class="unit-price-tag">${fmt(unitPrice(unit))}</span></div>`;
    const allergyList = it.allergies !== undefined ? it.allergies : ALLERGY_FLAGS;
    return `
      <div class="unit-block">
        ${unitHead}
        ${copyLink}
        ${choiceGroupsHTML}
        ${optionGroupHTML(idx, "Options", it.options, "opt-")}
        ${optionGroupHTML(idx, "Extras", it.extras, "ext-")}
        ${optionGroupHTML(idx, "Add ons", it.addons, "add-")}
        ${optionGroupHTML(idx, "Allergy / dietary flags", allergyList, "alg-", "allergy")}
        <div class="group-title">Kitchen note</div>
        <textarea data-note-unit="${idx}" placeholder="e.g. dressing on the side...">${unit.note}</textarea>
      </div>
    `;
  }).join("");

  modalBody.innerHTML = `
    <div class="sheet-handle"></div>
    <h3>${it.name}</h3>
    ${it.desc ? `<div class="modal-desc">${it.desc}</div>` : ""}
    <div class="modal-qty-row">
      <span class="qty-label">How many ${it.name} for this table?</span>
      <div class="qty-group">
        <button class="qty-btn" id="modalQtyMinus" aria-label="${pendingQty<=1 ? (editingLine ? "Remove from order" : "Don't add") : "One less"}">−</button>
        <span class="qty-val" id="modalQtyVal">${pendingQty}</span>
        <button class="qty-btn" id="modalQtyPlus">+</button>
      </div>
    </div>
    ${unitsHTML}
    <div class="modal-footer">
      <button class="modal-cancel" id="modalCancel">Cancel</button>
      <button class="modal-confirm" id="modalConfirm">Add ${pendingQty>1?"all "+pendingQty+" — ":"— "}<span class="modal-price-live">${fmt(totalAllUnits())}</span></button>
    </div>
  `;

  document.getElementById("modalQtyMinus").addEventListener("click", ()=>{
    if(pendingQty > 1){ setQty(pendingQty-1); return; }
    removeFromSheetAtZero();
  });
  document.getElementById("modalQtyPlus").addEventListener("click", ()=> setQty(pendingQty+1));

  modalBody.querySelectorAll(".opt-row").forEach(row=>{
    row.addEventListener("click", (e)=>{
      e.preventDefault();
      const unitIdx = parseInt(row.dataset.unit, 10);
      const key = row.dataset.key;
      const group = row.dataset.group;
      const single = row.dataset.single === "true";
      const unit = pendingUnits[unitIdx];
      const existingIdx = unit.selections.findIndex(s=>s.key===key);
      if(single){
        if(existingIdx>-1){
          unit.selections.splice(existingIdx,1); // tap again to clear the pick
        } else {
          unit.selections = unit.selections.filter(s=>!s.key.startsWith(group));
          unit.selections.push({key, label: row.dataset.label, price: parseFloat(row.dataset.price)});
        }
      } else {
        if(existingIdx>-1){
          unit.selections.splice(existingIdx,1);
        } else {
          unit.selections.push({key, label: row.dataset.label, price: parseFloat(row.dataset.price)});
        }
      }
      renderModal();
    });
  });

  modalBody.querySelectorAll("[data-note-unit]").forEach(ta=>{
    ta.addEventListener("input", (e)=>{
      pendingUnits[parseInt(ta.dataset.noteUnit,10)].note = e.target.value;
    });
  });

  modalBody.querySelectorAll("[data-copy-to]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.copyTo, 10);
      pendingUnits[idx] = {
        selections: pendingUnits[0].selections.map(s=>({...s})),
        note: pendingUnits[0].note
      };
      renderModal();
    });
  });

  document.getElementById("modalCancel").addEventListener("click", closeSheetAnimated);
  document.getElementById("modalConfirm").addEventListener("click", confirmAddToOrder);
}

function confirmAddToOrder(){
  const item = pendingItem;
  const qty = pendingQty;
  const edited = editingLine;
  if(edited){
    const idx = order.findIndex(l=>l.uid===edited.uid);
    if(idx > -1) order.splice(idx, 1);
  }
  pendingUnits.forEach(unit=>{
    addOrUpdateLine(item, unit.selections, unit.note.trim(), 1);
  });
  if(edited && edited.sentQty > 0){
    // unchanged configuration → don't re-send what the kitchen already has
    const same = order.find(l=>l.key===edited.key);
    if(same) same.sentQty = Math.min(edited.sentQty, same.qty);
  }
  closeModal();
  renderTicket();
  refreshCardSteppers();
  showToast(edited ? `${item.name} updated` : `${qty>1 ? qty+"× " : ""}${item.name} added to ticket`);
}

overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeSheetAnimated(); });

/* Bottom sheet: slide it down (and fade the backdrop) before closing,
   and let the waiter drag it down with a finger to dismiss — from the
   handle/top area, or anywhere once the sheet is scrolled to the top. */
function closeSheetAnimated(){
  if(!overlay.classList.contains("open")) return;
  modalBody.style.transition = "transform var(--cui-transitions-slow)";
  modalBody.style.transform = "translateY(100%)";
  overlay.style.transition = "background-color var(--cui-transitions-slow)";
  overlay.style.backgroundColor = "transparent";
  setTimeout(()=>{
    closeModal();
    modalBody.style.transition = modalBody.style.transform = "";
    overlay.style.transition = overlay.style.backgroundColor = "";
  }, 300);
}
(function enableSheetSwipe(){
  let startY = 0, lastY = 0, lastT = 0, velocity = 0, dragging = false, armed = false;
  modalBody.addEventListener("touchstart", (e)=>{
    if(e.touches.length !== 1) return;
    armed = modalBody.scrollTop <= 0;
    dragging = false;
    startY = lastY = e.touches[0].clientY;
    lastT = performance.now();
    velocity = 0;
  }, {passive:true});
  modalBody.addEventListener("touchmove", (e)=>{
    if(!armed) return;
    const y = e.touches[0].clientY;
    const dy = y - startY;
    if(!dragging){
      if(dy > 6) dragging = true;          // pulling down → start drag
      else if(dy < -6){ armed = false; return; } // scrolling up → normal scroll
      else return;
    }
    e.preventDefault();                      // stop the page/sheet scrolling while dragging
    const now = performance.now();
    velocity = (y - lastY) / Math.max(1, now - lastT);
    lastY = y; lastT = now;
    modalBody.style.transition = "none";
    modalBody.style.transform = `translateY(${Math.max(0, dy)}px)`;
    const fade = Math.max(0, 1 - dy / (modalBody.offsetHeight || 1));
    overlay.style.backgroundColor = `rgba(30,28,28,${0.7 * fade})`;
  }, {passive:false});
  modalBody.addEventListener("touchend", ()=>{
    if(!dragging){ armed = false; return; }
    const dy = lastY - startY;
    dragging = armed = false;
    if(dy > 110 || velocity > 0.6){
      closeSheetAnimated();
    } else {
      modalBody.style.transition = "transform var(--cui-transitions-slow)";
      modalBody.style.transform = "translateY(0)";
      overlay.style.backgroundColor = "";
    }
  });
})();

/* ---------------------------------------------------------------
   FREE-TEXT PARSING — "2 eggo", "sunny stack gluten free toasted
   bread", "conqurer without mozzarella". The text is split into:
   quantity → dish name (typo-tolerant) → modifier phrases. Phrases
   that match one of the dish's real options/extras/add-ons/choices
   become proper priced modifiers; everything else (e.g. "cooked
   eggs", "without mozzarella") goes into the kitchen note verbatim.
--------------------------------------------------------------- */
const NUM_WORDS = {one:1,two:2,three:3,four:4,five:5,six:6,ein:1,eine:1,zwei:2,drei:3,vier:4};
const MOD_STOPWORDS = new Set(["not","made","in","with","without","the","of","a","and","no"]);
const PHRASE_SPLIT = /\s*(?:,|;|\+|\band\b|\bwith\b|\bplus\b|\bund\b|\bmit\b)\s*|\s+(?=\b(?:without|no|ohne|kein|keine)\b)/i;

function rankItems(q){
  return ALL_ITEMS_FLAT
    .map(it => ({ it, score: fuzzyScore(q, it.name) }))
    .filter(x => x.score > 0)
    .sort((a,b)=> b.score - a.score);
}

function parseChatInput(text){
  let s = text.trim();
  if(!s) return null;
  let qty = 1;
  let m = s.match(/^(\d{1,2})\s*(?:x|×)?\s*(.*)$/i);
  if(m){ qty = Math.min(20, Math.max(1, parseInt(m[1],10))); s = m[2].trim(); }
  else {
    m = s.match(/^(one|two|three|four|five|six|ein|eine|zwei|drei|vier)\s+(.+)$/i);
    if(m){ qty = NUM_WORDS[m[1].toLowerCase()]; s = m[2].trim(); }
  }
  const words = s.split(/\s+/).filter(Boolean);
  if(words.length === 0) return null;
  // Try the first 1..5 words as the dish name; keep the prefix whose
  // best match scores highest (longer prefix wins ties), so the rest
  // of the text is treated as modifiers.
  let best = null;
  for(let k=1; k<=Math.min(words.length,5); k++){
    const ranked = rankItems(words.slice(0,k).join(" "));
    const score = ranked.length ? ranked[0].score : 0;
    if(score > 0 && (!best || score >= best.score)){
      best = { k, score, ranked };
    }
  }
  if(!best) return { qty, rest: "", ranked: [], confident: false };
  const ranked = best.ranked;
  const confident = best.score >= 300 &&
    (ranked.length < 2 || best.score - ranked[1].score >= 100 || best.score >= 1000);
  return { qty, rest: words.slice(best.k).join(" "), ranked, confident };
}

function tokMatch(a, b){
  if(a === b) return true;
  if(a.length >= 3 && b.startsWith(a)) return true;
  return a.length >= 4 && b.length >= 4 && levenshtein(a, b) <= (a.length >= 5 ? 2 : 1);
}

// Fixes typos in free-text note words against words the dish itself
// uses (its description and option names) — "mozerellla" → "mozzarella".
function autocorrectNote(item, phrase){
  const vocab = new Set();
  const src = [item.desc || "", item.name]
    .concat([item.options, item.extras, item.addons].flatMap(l => (l || []).map(o => o.label)))
    .concat((item.choiceGroups || []).flatMap(g => g.choices.map(c => c.label)));
  src.forEach(t => normText(t).split(" ").forEach(w => { if(w.length >= 5) vocab.add(w); }));
  return phrase.split(/\s+/).map(w => {
    const n = normText(w);
    if(n.length < 5 || vocab.has(n)) return w;
    const allowed = n.length >= 9 ? 3 : 2;
    let best = null, bd = allowed + 1;
    vocab.forEach(v => {
      if(v[0] !== n[0]) return;
      const d = levenshtein(n, v);
      if(d < bd){ bd = d; best = v; }
    });
    return best ? best : w;
  }).join(" ");
}

function mapModifiers(item, rest){
  const cands = [];
  const add = (prefix, list, group) => (list || []).forEach((o,i)=>
    cands.push({ key: prefix+i, label:o.label, price:o.price, group: group || null }));
  add("opt-", item.options);
  add("ext-", item.extras);
  add("add-", item.addons);
  (item.choiceGroups || []).forEach(g => add("cg-"+g.key+"-", g.choices, g.key));
  add("alg-", item.allergies !== undefined ? item.allergies : ALLERGY_FLAGS);

  const mods = [], notes = [];
  rest.split(PHRASE_SPLIT).map(x=>x.trim()).filter(Boolean).forEach(ph=>{
    if(/^(without|no|ohne|kein|keine|hold|minus)\b/i.test(ph)){ notes.push(autocorrectNote(item, ph)); return; }
    const ptoks = normText(ph).split(" ").filter(Boolean);
    let best = null, bestShare = 0;
    cands.forEach(c=>{
      const ltoks = normText(c.label).split(" ").filter(t=>t && !MOD_STOPWORDS.has(t));
      if(!ltoks.length) return;
      const covered = ptoks.every(p => ltoks.some(l => tokMatch(p, l)));
      if(!covered) return;
      const share = ltoks.filter(l => ptoks.some(p => tokMatch(p, l))).length / ltoks.length;
      if(share >= 0.5 && share > bestShare){ best = c; bestShare = share; }
    });
    if(!best){ notes.push(autocorrectNote(item, ph)); return; }
    const idx = mods.findIndex(x => x.key === best.key || (best.group && x.group === best.group));
    if(idx > -1) mods.splice(idx, 1);
    mods.push(best);
    // e.g. label "(not toasted)" but the waiter said "toasted":
    // keep their exact words as a note so the kitchen sees the conflict.
    const ltoksAll = normText(best.label).split(" ");
    const ni = ltoksAll.indexOf("not");
    if(ni > -1 && !ptoks.includes("not") &&
       ltoksAll.slice(ni+1).some(w => ptoks.some(p => tokMatch(p, w)))){
      notes.push(autocorrectNote(item, ph));
    }
  });
  return {
    mods: mods.map(m => ({ key:m.key, label:m.label, price:m.price })),
    note: notes.join("; ")
  };
}

function describeParsed(item, p){
  const r = mapModifiers(item, p.rest);
  const bits = [`${p.qty}× ${item.name}`];
  r.mods.forEach(m => bits.push(m.label));
  if(r.note) bits.push("📝 " + r.note);
  return bits.join(" · ");
}

function addParsedLine(item, p){
  const r = mapModifiers(item, p.rest);
  addOrUpdateLine(item, r.mods, r.note, p.qty);
  renderTicket();
  refreshCardSteppers();
  showToast(`${p.qty}× ${item.name} added to ticket`);
}

function finishChatEntry(){
  const input = document.getElementById("chatInput");
  input.value = "";
  renderChatSuggestions("");
  input.focus();
}

/* Suggestion tags (+ a one-line preview of what Enter will add).
   Tapping a tag adds the item (with any typed quantity/modifiers). */
function renderChatSuggestions(text){
  const box = document.getElementById("chatSuggestions");
  if(!box) return;
  const p = text.trim() ? parseChatInput(text) : null;
  if(!p){ box.innerHTML = ""; return; }
  if(p.ranked.length === 0){
    box.innerHTML = `<span class="chat-tag no-match">No matching dish or drink</span>`;
    return;
  }
  const drinkNames = new Set(DRINKS_MENU.flatMap(c => c.items.map(i => i.name)));
  const foodTags = p.ranked.filter(x => !drinkNames.has(x.it.name)).slice(0, 5).map(x => x.it);
  const drinkTags = p.ranked.filter(x => drinkNames.has(x.it.name)).slice(0, 5).map(x => x.it);
  const preview = p.confident
    ? `<div class="chat-preview">↵ Adds: ${describeParsed(p.ranked[0].it, p)}</div>` : "";
  const tagBtn = it => `<button type="button" class="chat-tag" data-name="${escapeAttr(it.name)}">${it.name}</button>`;
  const group = (label, list) => list.length
    ? `<div class="chat-tag-group"><div class="chat-tag-label">${label}</div><div class="chat-tag-row">${list.map(tagBtn).join("")}</div></div>` : "";
  const ICON_FOOD = '<svg class="cui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12.833 3a1 1 0 1 0-2 0v3a1 1 0 1 0 2 0V3Zm7 6c1.105 0 2.02.904 1.801 1.987a9.998 9.998 0 0 1-13.627 7.252 10 10 0 0 1-5.974-7.252C1.813 9.904 2.729 9 3.833 9h16Zm-15 13a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2h-12a1 1 0 0 1-1-1Zm3-20a1 1 0 0 1 1 1v3a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1Zm9 1a1 1 0 1 0-2 0v3a1 1 0 1 0 2 0V3Z" fill="currentColor"/></svg>';
  const ICON_DRINKS = '<svg class="cui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" d="M20 11.947a2.58 2.58 0 0 0-2.474-2.574v5.147a2.58 2.58 0 0 0 1.72-.75A2.58 2.58 0 0 0 20 11.947M5.685 4.79V3a1 1 0 0 1 2 0v1.79a1 1 0 0 1-2 0m3.578 0V3a1 1 0 0 1 2 0v1.79a1 1 0 1 1-2 0m3.579 0V3a1 1 0 0 1 2 0v1.79a1 1 0 1 1-2 0M5 16.421A2.58 2.58 0 0 0 7.58 19h5.367a2.58 2.58 0 0 0 2.58-2.58V9.369H5zm17-4.474a4.58 4.58 0 0 1-4.477 4.576A4.58 4.58 0 0 1 12.947 21H7.58A4.58 4.58 0 0 1 3 16.42V9.264c0-.502.2-.984.555-1.34l.14-.125c.336-.276.76-.43 1.2-.43H17.42A4.58 4.58 0 0 1 22 11.948"/></svg>';
  box.innerHTML = preview + group(ICON_FOOD + "<span>Food</span>", foodTags) + group(ICON_DRINKS + "<span>Drinks</span>", drinkTags);
  box.querySelectorAll(".chat-tag:not(.no-match)").forEach(tag=>{
    tag.addEventListener("click", ()=>{
      const item = findItemByName(tag.dataset.name);
      if(!item) return;
      addParsedLine(item, p);
      finishChatEntry();
    });
  });
}

/* Enter/send: a confident dish match is added straight to the order
   with whatever modifiers/note were typed; an ambiguous dish keeps the
   suggestion tags up. Customizing happens by tapping the item's
   message in the chat. */
function handleChatSubmit(){
  const input = document.getElementById("chatInput");
  const p = parseChatInput(input.value);
  if(!p) return;
  if(p.ranked.length === 0 || !p.confident){
    renderChatSuggestions(input.value);
    showToast(p.ranked.length ? "Pick the dish from the suggestions" : "No matching dish or drink");
    return;
  }
  const item = p.ranked[0].it;
  addParsedLine(item, p);
  finishChatEntry();
}

document.getElementById("chatInput").addEventListener("input", (e)=>{
  renderChatSuggestions(e.target.value);
});
document.getElementById("chatInputForm").addEventListener("submit", (e)=>{
  e.preventDefault();
  handleChatSubmit();
});

function changeQty(uid, delta){
  const line = order.find(l=>l.uid===uid);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0){
    const idx = order.indexOf(line);
    if(idx > -1) order.splice(idx, 1);
  } else {
    line.sentQty = Math.min(line.sentQty, line.qty);
  }
  renderTicket();
  refreshCardSteppers();
}

function removeLine(uid){
  const idx = order.findIndex(l=>l.uid===uid);
  if(idx > -1) order.splice(idx, 1);
  renderTicket();
  refreshCardSteppers();
}

document.getElementById("clearBtn").addEventListener("click", ()=>{
  if(order.length===0) return;
  if(confirm("Clear the entire order for this table?")){
    order.length = 0;
    renderTicket();
    refreshCardSteppers();
  }
});

sendBtn.addEventListener("click", ()=>{
  if(!currentTable || order.length===0) return;

  // Only broadcast what hasn't already been sent — a line added after
  // an earlier send only forwards its NEW quantity, so the kitchen
  // never gets duplicate prep tickets for the same dish.
  const linesToSend = [];
  let newItemsPrice = 0;
  order.forEach(line=>{
    const unsent = line.qty - line.sentQty;
    if(unsent > 0){
      linesToSend.push({ name: line.name, qty: unsent, mods: line.mods, note: line.note });
      newItemsPrice += line.unitPrice * unsent;
    }
  });

  if(linesToSend.length === 0){
    showToast("Nothing new to send — this table's order is already with the kitchen.");
    return;
  }

  const sentTable = currentTable;
  const tableLines = order;               // this table's live line array
  const guests = (tableMeta[currentTable] && tableMeta[currentTable].guests) || "";
  const prevSent = new Map(tableLines.map(l=>[l, l.sentQty]));

  // The order STAYS in the ticket (not cleared) so the waiter can
  // still see everything that's been ordered for this table, sent or
  // not — only the "sent" marker moves forward.
  tableLines.forEach(line=>{ line.sentQty = line.qty; });

  let settled = false;
  const slowTimer = setTimeout(()=>{
    if(!settled) showToast(`⏳ Table ${sentTable}: still waiting for the kitchen to confirm — check this phone's internet.`, 6000);
  }, 6000);

  broadcastOrderToKitchen(sentTable, guests, linesToSend)
    .then(()=>{
      settled = true; clearTimeout(slowTimer);
      showToast(`✓ Kitchen received Table ${sentTable} — ${fmt(newItemsPrice)}`);
    })
    .catch(err=>{
      settled = true; clearTimeout(slowTimer);
      // Undo the "sent" marks so the waiter can simply press Send again.
      tableLines.forEach(line=>{ if(prevSent.has(line)) line.sentQty = prevSent.get(line); });
      if(typeof renderTableGrid === "function") renderTableGrid();
      renderTicket();
      const msg = String(err && (err.code || err.message) || err);
      const hint = /permission/i.test(msg) ? " — Firebase rules are blocking writes." : "";
      showToast(`⚠️ NOT sent to kitchen (Table ${sentTable}): ${msg}${hint}`, 9000);
      console.error("Kitchen send failed:", err);
    });

  renderTicket();
  goToTableSelect();
});

document.getElementById("guestCount").addEventListener("input", (e)=>{
  if(currentTable) tableMeta[currentTable].guests = e.target.value;
  renderTicket();
});

/* ---------------------------------------------------------------

/* ---------------------------------------------------------------
   PAGE SWIPE — Food and Drinks live side by side on a sliding track.
   Tapping a tab or swiping switches between them, so the drinks menu
   doesn't force a long scroll past the whole food menu to reach.
--------------------------------------------------------------- */
let currentPage = "food"; // "food" | "drinks"
const pagesTrack = document.getElementById("pagesTrack");
const pagesViewport = document.getElementById("pagesViewport");

// Measures the tabs' real rendered height and exposes it as a CSS
// variable, so the sticky filter/search block below always sits
// exactly flush against it — no hardcoded pixel guess to drift out
// of sync across font sizes or breakpoints (which was causing a gap
// or overlap depending on screen size).
function syncTabsHeight(){
  const tabsEl = document.querySelector(".page-tabs");
  if(tabsEl){
    document.documentElement.style.setProperty("--tabs-height", tabsEl.offsetHeight + "px");
    const topEl = document.querySelector("header.top");
    const topH = topEl ? topEl.offsetHeight : 0;
    document.documentElement.style.setProperty("--chrome-h", (topH + tabsEl.offsetHeight) + "px");
  }
}
syncTabsHeight();
window.addEventListener("resize", syncTabsHeight);
if(window.ResizeObserver){
  new ResizeObserver(syncTabsHeight).observe(document.querySelector(".page-tabs"));
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncTabsHeight);

// Hide the filter pills + search bar while scrolling down (to give the
// menu more room), and bring them back the moment the person scrolls
// up even slightly — a small threshold avoids it flickering on tiny
// scroll jitters, and it always reappears near the very top.
// Collapsing/expanding the block itself moves the page content, which
// fires extra scroll events — those are ignored for the length of the
// animation so the bar can't flicker open/closed on its own.
let lastScrollY = window.scrollY;
let controlsLockUntil = 0;
window.addEventListener("scroll", ()=>{
  const y = window.scrollY;
  const now = performance.now();
  if(now < controlsLockUntil){ lastScrollY = y; return; }
  const goingDown = y > lastScrollY;
  const delta = Math.abs(y - lastScrollY);
  const controls = document.querySelectorAll(".sticky-controls");
  const wasHidden = controls.length && controls[0].classList.contains("controls-hidden");
  let hide = wasHidden;
  if(y < 30) hide = false;
  else if(delta > 4) hide = goingDown;
  if(hide !== wasHidden){
    controls.forEach(el=> el.classList.toggle("controls-hidden", hide));
    controlsLockUntil = now + 350;
  }
  lastScrollY = y;
}, {passive:true});

/* Safari's keyboard shrinks only the *visual* viewport (fixed
   elements don't move), so mirror its size/offset into CSS variables
   that the chat-mode layout is sized from. */
function syncVisualViewport(){
  const vv = window.visualViewport;
  const root = document.documentElement.style;
  root.setProperty("--vv-h", (vv ? vv.height : window.innerHeight) + "px");
  root.setProperty("--vv-top", (vv ? vv.offsetTop : 0) + "px");
  if(document.body.classList.contains("chat-mode")){
    const log = document.getElementById("chatLog");
    if(log) log.scrollTop = log.scrollHeight;
  }
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", ()=>{ syncVisualViewport(); if(document.body.classList.contains("chat-mode")) window.scrollTo(0,0); });
  window.visualViewport.addEventListener("scroll", ()=>{ syncVisualViewport(); if(document.body.classList.contains("chat-mode")) window.scrollTo(0,0); });
}
window.addEventListener("resize", syncVisualViewport);
syncVisualViewport();
document.getElementById("chatInput").addEventListener("focus", ()=>{
  [50, 250, 600].forEach(t => setTimeout(()=>{ syncVisualViewport(); window.scrollTo(0,0); }, t));
});

let savedScrollBeforeChat = 0;
function goToPage(page){
  const wasChat = currentPage === "chat";
  if(page === "chat" && !wasChat) savedScrollBeforeChat = window.scrollY;
  currentPage = page;
  const pagesClip = document.getElementById("pagesClip");
  const chatPanel = document.getElementById("chatPanel");
  document.body.classList.toggle("chat-mode", page === "chat");
  syncTabsHeight();
  syncVisualViewport();
  if(page === "chat") window.scrollTo(0,0);
  else if(wasChat) window.scrollTo(0, savedScrollBeforeChat);
  if(page === "chat"){
    pagesClip.style.display = "none";
    chatPanel.classList.add("active");
    renderChatLog();
  } else {
    pagesClip.style.display = "";
    chatPanel.classList.remove("active");
    pagesTrack.style.transform = page === "drinks" ? "translateX(-50%)" : "translateX(0)";
  }
  document.querySelectorAll(".page-tab").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.page === page);
  });
}

document.querySelectorAll(".page-tab").forEach(btn=>{
  btn.addEventListener("click", ()=> goToPage(btn.dataset.page));
});

let swipeStartX = 0, swipeStartY = 0, swiping = false;
pagesViewport.addEventListener("touchstart", (e)=>{
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swiping = true;
}, {passive:true});
pagesViewport.addEventListener("touchend", (e)=>{
  if(!swiping) return;
  swiping = false;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
    if(dx > 0 && currentPage === "food") goToPage("drinks");   // swipe right -> Drinks
    else if(dx < 0 && currentPage === "drinks") goToPage("food"); // swipe left -> back to Food
  }
}, {passive:true});

/* ---------------------------------------------------------------
   TOAST
--------------------------------------------------------------- */
let toastTimer;
function showToast(msg, ms){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove("show"), ms || 2400);
}

   INIT — start on the table-select screen; the order pad itself
   only becomes visible once a table has been chosen.
--------------------------------------------------------------- */
renderFilterBar();
renderDrinksFilterBar();
renderDrinksMenu();
renderTableGrid();
